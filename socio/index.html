<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1A5FB4;--azul-medio:#2272D9;--azul-claro:#5BA3E8;--azul-pale:#EBF3FC;--noche:#0D1B3E;--fondo:#F5F7FA;--texto:#1a2340;--suave:#5a6a8a;--rojo:#e11d48;--verde:#166534}
body{font-family:'Nunito',sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;-webkit-tap-highlight-color:transparent}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(145deg,var(--noche),#1A3A7A,var(--azul))}
.screen.active{display:flex}
.auth-card{background:white;border-radius:24px;padding:36px 28px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.auth-card.tall{max-height:92vh;overflow-y:auto}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.auth-logo .marca{font-weight:900;font-size:1.6rem;color:var(--azul);letter-spacing:-1px}
.auth-logo .marca span{color:var(--azul-claro)}
.auth-title{font-size:1.1rem;font-weight:800;margin-bottom:4px;color:var(--noche);text-align:center}
.auth-sub{font-size:.8rem;color:var(--suave);margin-bottom:18px;text-align:center}
.fstack{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:10px}
.input-field{width:100%;padding:12px 14px;border:2px solid rgba(26,95,180,.15);border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;color:var(--texto);background:var(--fondo);outline:none;transition:border-color .2s;display:block}
.input-field:focus{border-color:var(--azul-medio);background:white}
.btn-primary{width:100%;padding:13px;background:var(--azul);color:white;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:background .2s}
.btn-primary:hover:not(:disabled){background:var(--noche)}
.btn-primary:disabled{opacity:.6}
.link-btn{background:none;border:none;color:var(--azul);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:underline}
.divider{border-top:1px solid var(--azul-pale);margin:16px 0;padding-top:14px;text-align:center}
.errmsg{font-size:.82rem;color:var(--rojo);font-weight:700;min-height:1em}
.foto-label{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--azul-pale);border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:700;color:var(--azul);border:2px dashed rgba(26,95,180,.2)}
/* App */
#appScreen{display:none}
.app-nav{background:var(--noche);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;padding-top:calc(14px + env(safe-area-inset-top))}
.app-nav .logo{display:flex;align-items:center;gap:8px}
.app-nav .logo .marca{font-weight:900;font-size:1.1rem;color:white;letter-spacing:-.5px}
.app-nav .logo .marca span{color:var(--azul-claro)}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;padding:7px 16px;border-radius:100px;cursor:pointer}
.app-body{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.seccion{background:white;border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 10px rgba(26,95,180,.05)}
.stit{font-size:.72rem;font-weight:800;color:var(--noche);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
/* Carnet de la mascota */
.carnet{background:linear-gradient(135deg,var(--azul-medio),var(--noche));border-radius:20px;padding:20px;color:white;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(26,95,180,.3)}
.carnet .iso{position:absolute;top:14px;right:14px;opacity:.9}
.carnet .cplan-lbl{font-size:.58rem;font-weight:700;letter-spacing:2px;opacity:.6;text-transform:uppercase}
.carnet .cplan{font-size:.9rem;font-weight:800;color:var(--azul-claro);margin-bottom:12px}
.carnet .mrow{display:flex;align-items:center;gap:14px}
.carnet .mfoto{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.carnet .mph{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.carnet .mname{font-size:1.35rem;font-weight:900;line-height:1}
.carnet .mraza{font-size:.66rem;opacity:.65;text-transform:uppercase;letter-spacing:1px}
.carnet .cfoot{margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end}
.carnet .resp-lbl{font-size:.56rem;opacity:.6;font-weight:700;letter-spacing:.5px}
.carnet .resp{font-size:.78rem;font-weight:700}
.cobchip{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:4px 10px;font-size:.66rem;font-weight:800}
.cobdot{width:6px;height:6px;border-radius:50%;display:inline-block}
/* Selector de mascota */
.masc-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.masc-tab{flex-shrink:0;display:flex;align-items:center;gap:7px;background:white;border:2px solid rgba(26,95,180,.12);border-radius:100px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:800;font-size:.82rem;color:var(--suave)}
.masc-tab.active{border-color:var(--azul-medio);color:var(--azul);background:var(--azul-pale)}
.masc-tab img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.masc-tab .ph{width:26px;height:26px;border-radius:50%;background:var(--azul-pale);display:flex;align-items:center;justify-content:center;font-size:.9rem}
/* Emergencia */
.btn-emerg{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:linear-gradient(135deg,#e11d48,#9f1239);color:white;border-radius:18px;padding:18px;text-decoration:none;font-weight:900;box-shadow:0 10px 30px rgba(225,29,72,.35);margin-bottom:14px}
.btn-emerg .em-top{font-size:1.05rem;letter-spacing:.5px}
.btn-emerg .em-sub{display:block;font-size:.72rem;font-weight:700;opacity:.9;letter-spacing:.3px}
.btn-emerg .em-ico{font-size:1.7rem}
/* Tiles / placeholders */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:white;border:1px solid rgba(26,95,180,.08);border-radius:16px;padding:15px 16px;margin-bottom:12px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 2px 10px rgba(26,95,180,.05);position:relative}
.tile:disabled{cursor:default}
.tile .t-ico{width:44px;height:44px;border-radius:12px;background:var(--azul-pale);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.tile .t-body{flex:1}
.tile .t-title{font-size:.95rem;font-weight:800;color:var(--noche)}
.tile .t-sub{font-size:.76rem;color:var(--suave);margin-top:1px}
.tile .t-soon{font-size:.6rem;font-weight:800;color:var(--suave);background:var(--fondo);border:1px solid rgba(26,95,180,.12);border-radius:100px;padding:2px 8px;text-transform:uppercase;letter-spacing:.5px}
.tile .t-arrow{color:var(--azul-claro);font-size:1.1rem}
/* Feed / instalar */
.foot-note{font-size:.72rem;color:var(--suave);text-align:center;line-height:1.5;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--noche);color:white;padding:12px 20px;border-radius:100px;font-size:.85rem;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .3s;z-index:100;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--suave);font-weight:700}
</style>
</head>
<body>

<div id="bootScreen" class="boot">Cargando…</div>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <div class="auth-card">
    <div class="auth-logo"><svg width="44" height="44"><use href="#mp-iso"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Entrá a tu cuenta</div>

      <p id="loginError" class="errmsg"></p>
    </div>
    <div class="divider">
      <p style="font-size:.8rem;color:var(--suave);margin-bottom:8px;">¿Todavía no sos parte?</p>

    </div>

</div>

<!-- REGISTRO -->
<div id="registerScreen" class="screen">
  <div class="auth-card tall" style="max-width:480px;">
    <div class="auth-logo"><svg width="40" height="40"><use href="#mp-iso"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Afiliá a tu mascota</div>
    <div class="auth-sub">Tus datos y los de tu mascota</div>
    <div class="fstack">
      <div class="frow">
        <input type="text" id="regNombre" placeholder="Tu nombre *" class="input-field">
        <input type="text" id="regApellido" placeholder="Tu apellido" class="input-field">
      </div>
      <input type="email" id="regEmail" placeholder="Email *" class="input-field" autocomplete="email">
      <input type="tel" id="regTel" placeholder="Teléfono / WhatsApp" class="input-field">
      <input type="password" id="regPass" placeholder="Contraseña (mín. 6) *" class="input-field" autocomplete="new-password">
      <div style="border-top:1px solid var(--azul-pale);padding-top:12px;">
        <p style="font-size:.75rem;font-weight:800;color:var(--noche);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Tu mascota</p>
        <div class="frow">
          <input type="text" id="regMascota" placeholder="Nombre *" class="input-field">
          <input type="text" id="regRaza" placeholder="Raza" class="input-field">

          <label class="foto-label" for="regFoto">Foto de tu mascota (opcional)</label>

      </div>
      <button onclick="doRegistro()" class="btn-primary" id="btnRegistro">Crear mi cuenta</button>
      <p id="regError" class="errmsg"></p>
      <p style="font-size:.72rem;color:var(--suave);text-align:center;">Tu mascota queda pendiente de activación por MEDIPaw. Te contactamos para completar el alta.</p>
    </div>
    <div class="divider"><button onclick="showScreen('loginScreen')" class="link-btn">Ya tengo cuenta</button></div>

</div>

<!-- APP (home del titular) -->
<div id="appScreen">
  <nav class="app-nav">
    <div class="logo"><svg width="30" height="30"><use href="#mp-iso-w"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <button onclick="doLogout()" class="btn-logout">Salir</button>
  </nav>
  <div class="app-body"><div id="home"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBW3nLFqr55xYN16rSpapqIb6yVnyKbp-4",
  authDomain:"medipet-c3a4d.firebaseapp.com",
  projectId:"medipet-c3a4d",
  storageBucket:"medipet-c3a4d.firebasestorage.app",
  messagingSenderId:"893304150807",
  appId:"1:893304150807:web:4563f00e1a2a856124b552"
});
const auth=firebase.auth(), db=firebase.firestore();
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const MC=window.MEDIPAW; // núcleo puro compartido (no se duplica lógica)

// ⚠️ TEL DE GUARDIA VETERINARIA 24hs — PLACEHOLDER. ÚNICO lugar para cambiarlo (one-liner) cuando esté el número real.
const TEL_EMERG = '0800-000-0000';

// Roles del doc usuario (compat legacy rol→roles, prestador→veterinario vía el núcleo).
function getRoles(u){
  let roles = (u && Array.isArray(u.roles) && u.roles.length) ? u.roles.slice() : (u && u.rol ? [u.rol] : []);
  return roles.map(r => r==='prestador' ? 'veterinario' : r);
}

// ── Estado único ──
const S = { view:'boot', sub:'home', cred:null, mascotaSel:0, deferredPrompt:null, caso:null };
// Dispatcher del sub-view dentro del appScreen: home | caso ("[Nombre] no está bien")
function render(){ if(S.sub==='caso') casoView(); else homeView(); }
function volverHome(){ S.sub='home'; S.caso=null; render(); }

// ── Colección mascotas (fuente de verdad; reusa el núcleo) ──
async function mascGetByTitular(uid){
  const s = await db.collection('mascotas').where('titularUid','==',uid).get();
  return s.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>String(a.mascotaId||a.id).localeCompare(String(b.mascotaId||b.id)));
}

// ── Utilidades ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function v(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function showScreen(id){ ['bootScreen','loginScreen','registerScreen'].forEach(s=>{const e=document.getElementById(s);if(e){e.classList.remove('active');e.style.display=s==='bootScreen'?'none':'';}}); document.getElementById('appScreen').style.display='none'; if(id==='appScreen'){document.getElementById('appScreen').style.display='block';} else {const e=document.getElementById(id); if(e){e.style.display='';e.classList.add('active');}} }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600); }
function setErr(id,msg){ const el=document.getElementById(id); if(el) el.textContent=msg||''; }
function comprimirFoto(file,max){ max=max||480; return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let{width:w,height:h}=img; if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',.8)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
function previewFoto(input){ if(input.files&&input.files[0]){ const r=new FileReader(); r.onload=e=>{const p=document.getElementById('fotoPreview'); if(p){p.src=e.target.result;p.style.display='block';}}; r.readAsDataURL(input.files[0]); } }

// ── Auth: login / registro / logout ──
async function doLogin(){
  const email=v('loginEmail'), pass=document.getElementById('loginPass').value;
  setErr('loginError',''); if(!email||!pass){ setErr('loginError','Completá email y contraseña.'); return; }
  const btn=document.getElementById('btnLogin'); btn.disabled=true; btn.textContent='Ingresando…';
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ btn.disabled=false; btn.textContent='Ingresar'; setErr('loginError', e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found' ? 'Email o contraseña incorrectos.' : 'Error: '+e.message); }
}
async function doRegistro(){
  const nombre=v('regNombre'),apellido=v('regApellido'),email=v('regEmail'),tel=v('regTel');
  const pass=document.getElementById('regPass').value;
  const mascotaNombre=v('regMascota'),raza=v('regRaza');
  setErr('regError','');
  if(!nombre||!email||!pass||!mascotaNombre){ setErr('regError','Completá los campos con *.'); return; }
  if(pass.length<6){ setErr('regError','La contraseña necesita al menos 6 caracteres.'); return; }
  const btn=document.getElementById('btnRegistro'); btn.disabled=true; btn.textContent='Creando cuenta…';
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    let foto=''; const fEl=document.getElementById('regFoto');
    if(fEl&&fEl.files&&fEl.files[0]){ try{ foto=await comprimirFoto(fEl.files[0]); }catch(_){ } }
    // Mascota EMBEBIDA (compat con el panel); el doc de la colección lo crea el admin al activar (mascotaId al alta).
    await db.collection('usuarios').doc(uid).set({
      uid,nombre,apellido,email,telefono:tel,
      rol:'afiliado', roles:['afiliado'], estado:'pendiente',
      mascotas:[{ nombre:mascotaNombre, raza, fechaNacimiento:'', plan:'Sin definir', foto, mascotaId:'', token:'' }],
      creadoEn:TS()
    });
  }catch(e){
    btn.disabled=false; btn.textContent='Crear mi cuenta';
    setErr('regError', e.code==='auth/email-already-in-use' ? 'Ese email ya tiene cuenta.' : 'Error: '+e.message);
  }
}
function doLogout(){ auth.signOut(); }

// ── Ruteo por rol (login único). Titular (afiliado) se queda; staff PURO → panel /app/. ──
auth.onAuthStateChanged(async user=>{
  if(!user){ S.cred=null; showScreen('loginScreen'); return; }
  showScreen('bootScreen');
  try{
    const snap=await db.collection('usuarios').doc(user.uid).get();
    if(!snap.exists){ await auth.signOut(); showScreen('loginScreen'); setErr('loginError','Tu registro está en proceso.'); return; }
    const u={uid:user.uid,...snap.data()};
    const roles=getRoles(u);
    if(!MC.esTitular(roles)){
      // Sin rol de titular. Si es staff → al panel; si no, cartel honesto. (El mixto staff+afiliado SÍ es titular → se queda.)
      if(MC.esStaff(roles)){ window.location.replace('../app/'); return; }
      renderSinAcceso(u); return;
    }
    // Es titular (afiliado). Carga sus mascotas de la colección y muestra el home. (Si además es staff, se queda acá:
    // entró explícitamente a /socio/; el panel /app/ solo rebota al afiliado PURO.)
    let mascotas=[], casos=[];
    try{ mascotas=await mascGetByTitular(user.uid); }catch(_){ }
    try{ casos=(await db.collection('casos').where('titularUid','==',user.uid).get()).docs.map(d=>({id:d.id,...d.data()})); }catch(_){ }
    S.cred={ u, mascotas, casos }; S.mascotaSel=0; S.sub='home';
    render();
    showScreen('appScreen');
  }catch(e){ showScreen('loginScreen'); setErr('loginError','Error al cargar tu cuenta: '+e.message); }
});

function renderSinAcceso(u){
  document.getElementById('home').innerHTML = `
    <div class="seccion" style="text-align:center;">
      <div style="font-size:2.2rem;margin-bottom:8px;">🐾</div>
      <div class="stit" style="text-transform:none;font-size:1rem;">Todavía no tenés una mascota afiliada</div>
      <p style="font-size:.85rem;color:var(--suave);line-height:1.5;margin-top:6px;">Escribinos para afiliar a tu mascota y activar tu plan MEDIPaw.</p>
      <a class="btn-emerg" href="tel:${TEL_EMERG}" style="margin-top:14px;"><span class="em-ico">📞</span><span><span class="em-top">EMERGENCIA 24hs</span><span class="em-sub">Llamar a la guardia veterinaria</span></span></a>
    </div>`;
  showScreen('appScreen');
}

/* ══════════════ HOME DEL TITULAR — builder único por bloque, en el orden aprobado ══════════════ */
function homeView(){
  const c=S.cred; const m=mascotaActiva();
  document.getElementById('home').innerHTML =
    bloqueMascotaCarnet(c, m) +
    bloqueEmergencia() +
    bloqueIA(m) +
    bloqueNoEstaBien(m) +
    bloqueTurnos(m) +
    bloqueChequeo(m) +
    bloqueHistoria(m) +
    bloqueCuota(c) +
    bloqueMisMascotas(c) +
    bloqueInstalar() +
    bloqueFeed();
}
function mascotaActiva(){ const ms=S.cred.mascotas||[]; return ms[S.mascotaSel]||ms[0]||null; }
function nombreMasc(m){ return (m&&m.nombre) ? m.nombre : 'tu mascota'; }
function seleccionarMascota(i){ S.mascotaSel=i; homeView(); }
function toggleAddMasc(){ const f=document.getElementById('addMascForm'); if(f) f.style.display=f.style.display==='none'?'block':'none'; }
// Alta de mascota desde el estado vacío. Embebido (compat panel) + doc de colección si el titular ya tiene nroSocio
// (nace SUSPENDIDA, sin cobertura, hasta que admin la active — reglas: titular crea suspendido+cuota0).
async function agregarMascotaSocio(){
  const nombre=v('amNombre'), raza=v('amRaza'); const msg=document.getElementById('amMsg');
  if(msg) msg.textContent='';
  if(!nombre){ if(msg) msg.textContent='Poné el nombre de tu mascota.'; return; }
  const uid=S.cred.u.uid;
  try{
    const snap=await db.collection('usuarios').doc(uid).get(); const ud=snap.data();
    const mascotas=Array.isArray(ud.mascotas)?ud.mascotas.slice():[];
    const idx=mascotas.length;
    const mascotaId = ud.nroSocio ? MC.generarMascotaId(ud.nroSocio, idx) : '';
    mascotas.push({ nombre, raza, fechaNacimiento:'', plan:'Sin definir', foto:'', mascotaId, token:'' });
    await db.collection('usuarios').doc(uid).update({ mascotas });
    if(mascotaId){
      await db.collection('mascotas').doc(mascotaId).set({ mascotaId, titularUid:uid, nombre, raza, fechaNacimiento:'', foto:'', plan:'Sin definir', cuota:0, estado:'suspendido', token:'', servicios:[], creadoEn:TS() }, {merge:true});
    }
    toast(nombre+' agregada. Queda pendiente de activación.');
    S.cred.u.mascotas=mascotas;
    try{ S.cred.mascotas=await mascGetByTitular(uid); }catch(_){}
    S.mascotaSel=0; homeView();
  }catch(e){ if(msg) msg.textContent='Error: '+e.message; }
}

// 1) Selector de mascota + carnet DE LA MASCOTA (con 1 mascota: solo carnet, sin selector). Titular = responsable.
function bloqueMascotaCarnet(c, m){
  const ms=c.mascotas||[];
  const titular = `${esc(c.u.nombre||'')} ${esc(c.u.apellido||'')}`.trim() || 'Responsable';
  let selector='';
  if(ms.length>1){
    selector = `<div class="masc-tabs">` + ms.map((x,i)=>`
      <div class="masc-tab ${i===S.mascotaSel?'active':''}" onclick="seleccionarMascota(${i})">
        ${x.foto?`<img src="${esc(x.foto)}" alt="">`:`<span class="ph">🐾</span>`}
        <span>${esc(x.nombre||'—')}</span>
      </div>`).join('') + `</div>`;
  }
  if(!m){
    // Estado vacío (0 mascotas en la colección): recién registrado o sin mascotas. NUNCA pantalla vacía ni loop.
    const pend=(c.u.mascotas||[]).filter(x=>x&&x.nombre);
    const pendTxt = pend.length ? `Tenés a ${esc(pend.map(x=>x.nombre).join(', '))} pendiente de activación por MEDIPaw. Te contactamos para completarla.` : 'Sumá tu primera mascota para empezar.';
    return `<div class="seccion" style="text-align:center;">
      <div style="font-size:2rem;">🐾</div>
      <div class="stit" style="text-transform:none;font-size:1rem;margin-top:6px;">Todavía no tenés una mascota activa</div>
      <p style="font-size:.83rem;color:var(--suave);margin-top:4px;line-height:1.5;">${pendTxt}</p>
      <button class="btn-primary" style="margin-top:14px;" onclick="toggleAddMasc()">Agregar una mascota</button>
      <div id="addMascForm" style="display:none;margin-top:12px;text-align:left;">
        <div class="fstack">
          <input type="text" id="amNombre" placeholder="Nombre de tu mascota *" class="input-field">
          <input type="text" id="amRaza" placeholder="Raza (opcional)" class="input-field">
          <button class="btn-primary" onclick="agregarMascotaSocio()">Guardar</button>
          <p id="amMsg" class="errmsg"></p>
          <p style="font-size:.72rem;color:var(--suave);">Queda pendiente de activación por MEDIPaw.</p>
        </div>
      </div>
    </div>`;
  }
  const cob=MC.coberturaMascota(m); const cuota=MC.planCuota(m.plan);
  return selector + `
  <div class="carnet" style="margin-bottom:14px;">
    <div class="iso"><svg width="30" height="30"><use href="#mp-iso-w"/></svg></div>
    <div class="cplan-lbl">PLAN</div>
    <div class="cplan">${esc(m.plan||'Sin definir')}</div>
    <div class="mrow">
      ${m.foto?`<img class="mfoto" src="${esc(m.foto)}" alt="">`:`<div class="mph">🐾</div>`}
      <div><div class="mname">${esc(m.nombre||'—')}</div><div class="mraza">${esc(m.raza||'')}</div></div>
    </div>
    <div class="cfoot">
      <div>
        <div class="resp-lbl">RESPONSABLE</div>
        <div class="resp">${titular}</div>
        ${c.u.nroSocio?`<div style="font-size:.56rem;opacity:.5;letter-spacing:1px;">${esc(c.u.nroSocio)}</div>`:''}
      </div>
      <div class="cobchip" style="background:${cob.ok?'rgba(74,222,128,.18)':'rgba(248,113,113,.2)'};">
        <span class="cobdot" style="background:${cob.ok?'#4ade80':'#f87171'};"></span> ${esc(cob.chip)}
      </div>
    </div>
  </div>
  <div class="seccion" style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:${cob.ok?'#f0fdf4':'#fef2f2'};margin-bottom:14px;">
    <div style="font-size:.8rem;font-weight:700;color:${cob.color};">${cob.emoji} ${esc(cob.label)}${cob.ok&&cuota?` · $${cuota.toLocaleString('es-AR')}/mes`:''}</div>
  </div>`;
}

// 2) EMERGENCIA · guardia veterinaria 24hs — botón grande, tel:, constante única TEL_EMERG.
function bloqueEmergencia(){
  return `<a class="btn-emerg" href="tel:${TEL_EMERG}">
    <span class="em-ico">🚑</span>
    <span><span class="em-top">EMERGENCIA 24hs</span><span class="em-sub">Guardia veterinaria — llamar al ${esc(TEL_EMERG)}</span></span>
  </a>`;
}

// 3-8) Bloques que llegan en B y C → placeholders ordenados. Los "por mascota" llevan el NOMBRE.
function tilePlaceholder(ico, titulo, sub){
  return `<button class="tile" disabled>
    <div class="t-ico">${ico}</div>
    <div class="t-body"><div class="t-title">${titulo}</div><div class="t-sub">${sub}</div></div>
    <span class="t-soon">Pronto</span>
  </button>`;
}
function bloqueIA(m){ return tilePlaceholder('💬','MEDIPaw IA','Consultá sobre tu plan, tus mascotas o cómo cuidarlas'); }

// "[Nombre] no está bien" — tile REAL (abre el caso) + estado de los casos abiertos de esa mascota (cuidado/acción, sin clasificación).
function tms(t){ return t&&t.toMillis?t.toMillis():(t&&t.seconds?t.seconds*1000:0); }
function casosDe(m){ if(!m) return []; return (S.cred.casos||[]).filter(c=>c.mascotaId===m.mascotaId); }
function bloqueNoEstaBien(m){
  const abiertos = casosDe(m).filter(c=>c.estado!=='cerrado').sort((a,b)=>tms(b.creadoEn)-tms(a.creadoEn));
  let estado='';
  if(abiertos.length){
    const c=abiertos[0]; const st=MC.estadoCasoTitular(c.estado);
    estado = `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin:-4px 0 12px;">
      <div style="font-size:.8rem;font-weight:800;color:var(--azul);">${esc(st.texto)}</div>
      ${c.respuestaTitular?`<div style="font-size:.78rem;color:var(--texto);margin-top:4px;">💬 ${esc(c.respuestaTitular)}</div>`:''}
    </div>`;
  }
  return `<button class="tile" onclick="abrirCaso()">
    <div class="t-ico" style="background:#fee2e2;">🩹</div>
    <div class="t-body"><div class="t-title">${esc(nombreMasc(m))} no está bien</div><div class="t-sub">Contanos qué le pasa — un veterinario lo revisa</div></div>
    <span class="t-arrow">›</span>
  </button>` + estado;
}
function abrirCaso(){ S.sub='caso'; S.caso=null; render(); }
function casoView(){
  const m=mascotaActiva(); const nombre=nombreMasc(m);
  let body;
  if(!m){
    body = `<div class="seccion"><p style="font-size:.85rem;color:var(--suave);">Primero agregá una mascota para poder contarnos cómo está.</p></div>`;
  } else if(S.caso&&S.caso.done){
    body = `<div class="seccion" style="text-align:center;">
      <div style="font-size:2rem;">✅</div>
      <div class="stit" style="text-transform:none;font-size:1rem;margin-top:6px;">Recibimos lo de ${esc(nombre)}</div>
      <p style="font-size:.85rem;color:var(--suave);line-height:1.5;margin-top:6px;">Un veterinario lo va a revisar y te contactamos. Si mientras tanto se pone urgente, no esperes acá:</p>
      <a class="btn-emerg" href="tel:${TEL_EMERG}" style="margin-top:12px;"><span class="em-ico">🚑</span><span><span class="em-top">EMERGENCIA 24hs</span><span class="em-sub">Guardia veterinaria — ${esc(TEL_EMERG)}</span></span></a>
      <button class="btn-primary" style="margin-top:10px;" onclick="volverHome()">Volver al inicio</button>
    </div>`;
  } else {
    body = `<div class="seccion">
      <div class="stit" style="text-transform:none;font-size:1rem;">¿Qué le pasa a ${esc(nombre)}?</div>
      <div class="fstack" style="margin-top:10px;">
        <textarea id="casoRelato" class="input-field" style="height:90px;resize:vertical;" placeholder="Contanos qué notás: síntomas, comportamiento, qué te preocupa…"></textarea>
        <select id="casoDesde" class="input-field">
          <option value="">¿Desde cuándo?</option>
          <option value="hoy">Hoy</option>
          <option value="ayer">Ayer</option>
          <option value="varios_dias">Hace varios días</option>
        </select>
        <p id="casoMsg" class="errmsg"></p>
      </div>
      <p style="font-size:.8rem;font-weight:800;color:var(--noche);margin:6px 0 8px;">¿Puede esperar o es urgente?</p>
      <a class="btn-emerg" href="tel:${TEL_EMERG}"><span class="em-ico">🚑</span><span><span class="em-top">ES URGENTE — llamar ahora</span><span class="em-sub">No esperes respuesta acá. Guardia 24hs: ${esc(TEL_EMERG)}</span></span></a>
      <button class="btn-primary" style="margin-top:10px;" onclick="enviarCaso()">Puedo esperar — enviar a un veterinario</button>
    </div>`;
  }
  document.getElementById('home').innerHTML = `<button class="link-btn" style="margin-bottom:10px;display:inline-block;" onclick="volverHome()">‹ Volver</button>` + body;
}
async function enviarCaso(){
  const m=mascotaActiva(); if(!m) return;
  const relato=v('casoRelato'); const dEl=document.getElementById('casoDesde'); const desde=dEl?dEl.value:'';
  const msg=document.getElementById('casoMsg'); if(msg) msg.textContent='';
  if(!relato){ if(msg) msg.textContent='Contanos qué le pasa.'; return; }
  try{
    const ref=await db.collection('casos').add({
      mascotaId:m.mascotaId, mascotaNombre:m.nombre||'', titularUid:S.cred.u.uid,
      relato, desdeCuando:desde||'', urgenciaTitular:false, estado:'nuevo',
      respuestaTitular:'', atencionId:null, creadoEn:TS()
    });
    S.cred.casos=(S.cred.casos||[]).concat([{ id:ref.id, mascotaId:m.mascotaId, mascotaNombre:m.nombre, relato, estado:'nuevo', urgenciaTitular:false, respuestaTitular:'', creadoEn:{toMillis:()=>Date.now()} }]);
    S.caso={done:true}; casoView();
  }catch(e){ if(msg) msg.textContent='Error: '+e.message; }
}
function bloqueTurnos(m){ return tilePlaceholder('📅','Turnos','Pedí un turno para tu mascota'); }
function bloqueChequeo(m){ return tilePlaceholder('⚖️',`Chequeo y peso de ${esc(nombreMasc(m))}`,'Seguimiento de salud y peso'); }
function bloqueHistoria(m){ return tilePlaceholder('📋',`Historia de ${esc(nombreMasc(m))}`,'Atenciones, vacunas y estudios'); }
function bloqueCuota(c){ return tilePlaceholder('🧾','Cuota y comprobantes','Qué pagás, por qué mascota, tu historial'); }
function bloqueMisMascotas(c){ return tilePlaceholder('🐾','Mis mascotas y servicios','Tus mascotas, planes y servicios'); }

// 9) Instalar app (solo si no está instalada y hay prompt disponible).
function bloqueInstalar(){
  if(esStandalone()) return '';
  return `<div class="seccion" id="instalBlock" style="display:${S.deferredPrompt?'block':'none'};">
    <div class="stit">Instalá MEDIPaw</div>
    <p style="font-size:.82rem;color:var(--suave);margin-bottom:10px;">Tenela en tu teléfono, siempre a mano.</p>
    <button class="btn-primary" onclick="instalarApp()">Agregar a mi pantalla</button>
  </div>`;
}
function esStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
async function instalarApp(){ if(!S.deferredPrompt) return; S.deferredPrompt.prompt(); try{ await S.deferredPrompt.userChoice; }catch(_){ } S.deferredPrompt=null; const b=document.getElementById('instalBlock'); if(b) b.style.display='none'; }

// 10) Feed (placeholder por ahora; el contenido real llega más adelante).
function bloqueFeed(){
  return `<div class="seccion">
    <div class="stit">Para vos</div>
    <p style="font-size:.82rem;color:var(--suave);">Consejos de cuidado y novedades para tu mascota. <b>Pronto.</b></p>
    <div class="foot-note">Ante una emergencia, llamá directo al ${esc(TEL_EMERG)}.</div>
  </div>`;
}

// ── PWA install prompt ──
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); S.deferredPrompt=e; const b=document.getElementById('instalBlock'); if(b) b.style.display='block'; });

/* ── Service worker (SOLO en /socio/): cache versionado por deploy + skipWaiting/clients.claim ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(err=>console.warn('[sw] no se registró:',err)); });
  // Cuando el SW nuevo toma control (tras skipWaiting), recargá una vez para servir la versión fresca.
  let refrescado=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(refrescado) return; refrescado=true; window.location.reload(); });
}
</script>
</body>
</html>
