<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1A5FB4;--azul-medio:#2272D9;--azul-claro:#5BA3E8;--azul-pale:#EBF3FC;--noche:#0D1B3E;--fondo:#F5F7FA;--texto:#1a2340;--suave:#5a6a8a;--rojo:#e11d48;--verde:#166534}
body{font-family:'Nunito',sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;-webkit-tap-highlight-color:transparent}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(145deg,var(--noche),#1A3A7A,var(--azul))}
.screen.active{display:flex}
.auth-card{background:white;border-radius:24px;padding:36px 28px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.auth-card.tall{max-height:92vh;overflow-y:auto}
.auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.auth-logo .marca{font-weight:900;font-size:1.6rem;color:var(--azul);letter-spacing:-1px}
.auth-logo .marca span{color:var(--azul-claro)}
.auth-title{font-size:1.1rem;font-weight:800;margin-bottom:4px;color:var(--noche);text-align:center}
.auth-sub{font-size:.8rem;color:var(--suave);margin-bottom:18px;text-align:center}
.fstack{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:10px}
.input-field{width:100%;padding:12px 14px;border:2px solid rgba(26,95,180,.15);border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;color:var(--texto);background:var(--fondo);outline:none;transition:border-color .2s;display:block}
.input-field:focus{border-color:var(--azul-medio);background:white}
.btn-primary{width:100%;padding:13px;background:var(--azul);color:white;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:background .2s}
.btn-primary:hover:not(:disabled){background:var(--noche)}
.btn-primary:disabled{opacity:.6}
.link-btn{background:none;border:none;color:var(--azul);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:underline}
.divider{border-top:1px solid var(--azul-pale);margin:16px 0;padding-top:14px;text-align:center}
.errmsg{font-size:.82rem;color:var(--rojo);font-weight:700;min-height:1em}
.foto-label{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--azul-pale);border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:700;color:var(--azul);border:2px dashed rgba(26,95,180,.2)}
/* App */
#appScreen{display:none}
.app-nav{background:var(--noche);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;padding-top:calc(14px + env(safe-area-inset-top))}
.app-nav .logo{display:flex;align-items:center;gap:8px}
.app-nav .logo .marca{font-weight:900;font-size:1.1rem;color:white;letter-spacing:-.5px}
.app-nav .logo .marca span{color:var(--azul-claro)}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;padding:7px 16px;border-radius:100px;cursor:pointer}
.app-body{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.seccion{background:white;border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 10px rgba(26,95,180,.05)}
.stit{font-size:.72rem;font-weight:800;color:var(--noche);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
/* Carnet de la mascota */
.carnet{background:linear-gradient(135deg,var(--azul-medio),var(--noche));border-radius:20px;padding:20px;color:white;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(26,95,180,.3)}
.carnet .iso{position:absolute;top:14px;right:14px;opacity:.9}
.carnet .cplan-lbl{font-size:.58rem;font-weight:700;letter-spacing:2px;opacity:.6;text-transform:uppercase}
.carnet .cplan{font-size:.9rem;font-weight:800;color:var(--azul-claro);margin-bottom:12px}
.carnet .mrow{display:flex;align-items:center;gap:14px}
.carnet .mfoto{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.carnet .mph{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.carnet .mname{font-size:1.35rem;font-weight:900;line-height:1}
.carnet .mraza{font-size:.66rem;opacity:.65;text-transform:uppercase;letter-spacing:1px}
.carnet .cfoot{margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end}
.carnet .resp-lbl{font-size:.56rem;opacity:.6;font-weight:700;letter-spacing:.5px}
.carnet .resp{font-size:.78rem;font-weight:700}
.cobchip{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:4px 10px;font-size:.66rem;font-weight:800}
.cobdot{width:6px;height:6px;border-radius:50%;display:inline-block}
/* Selector de mascota */
.masc-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.masc-tab{flex-shrink:0;display:flex;align-items:center;gap:7px;background:white;border:2px solid rgba(26,95,180,.12);border-radius:100px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:800;font-size:.82rem;color:var(--suave)}
.masc-tab.active{border-color:var(--azul-medio);color:var(--azul);background:var(--azul-pale)}
.masc-tab img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.masc-tab .ph{width:26px;height:26px;border-radius:50%;background:var(--azul-pale);display:flex;align-items:center;justify-content:center;font-size:.9rem}
/* Emergencia */
.btn-emerg{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:linear-gradient(135deg,#e11d48,#9f1239);color:white;border-radius:18px;padding:18px;text-decoration:none;font-weight:900;box-shadow:0 10px 30px rgba(225,29,72,.35);margin-bottom:14px}
.btn-emerg .em-top{font-size:1.05rem;letter-spacing:.5px}
.btn-emerg .em-sub{display:block;font-size:.72rem;font-weight:700;opacity:.9;letter-spacing:.3px}
.btn-emerg .em-ico{font-size:1.7rem}
/* Tiles / placeholders */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:white;border:1px solid rgba(26,95,180,.08);border-radius:16px;padding:15px 16px;margin-bottom:12px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 2px 10px rgba(26,95,180,.05);position:relative}
.tile:disabled{cursor:default}
.tile .t-ico{width:44px;height:44px;border-radius:12px;background:var(--azul-pale);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.tile .t-body{flex:1}
.tile .t-title{font-size:.95rem;font-weight:800;color:var(--noche)}
.tile .t-sub{font-size:.76rem;color:var(--suave);margin-top:1px}
.tile .t-soon{font-size:.6rem;font-weight:800;color:var(--suave);background:var(--fondo);border:1px solid rgba(26,95,180,.12);border-radius:100px;padding:2px 8px;text-transform:uppercase;letter-spacing:.5px}
.tile .t-arrow{color:var(--azul-claro);font-size:1.1rem}
/* Feed / instalar */
.foot-note{font-size:.72rem;color:var(--suave);text-align:center;line-height:1.5;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--noche);color:white;padding:12px 20px;border-radius:100px;font-size:.85rem;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .3s;z-index:100;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--suave);font-weight:700}
</style>
</head>
<body>

<div id="bootScreen" class="boot">Cargando…</div>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <div class="auth-card">
    <div class="auth-logo"><svg width="44" height="44"><use href="#mp-iso"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Entrá a tu cuenta</div>

    <div class="fstack">
      <input type="email" id="loginEmail" placeholder="Email" class="input-field" autocomplete="email">
      <input type="password" id="loginPass" placeholder="Contraseña" class="input-field" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()" class="btn-primary" id="btnLogin">Ingresar</button>
      <p id="loginError" class="errmsg"></p>
    </div>
    <div class="divider">
      <p style="font-size:.8rem;color:var(--suave);margin-bottom:8px;">¿Todavía no sos parte?</p>
      <button onclick="showScreen('registerScreen')" class="link-btn">Afiliar a mi mascota</button>
    </div>
  </div>
</div>

<!-- REGISTRO -->
<div id="registerScreen" class="screen">
  <div class="auth-card tall" style="max-width:480px;">
    <div class="auth-logo"><svg width="40" height="40"><use href="#mp-iso"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Creá tu cuenta MEDIPaw</div>
    <div class="auth-sub">Después damos de alta a tu mascota</div>
    <div class="fstack">
      <div class="frow">
        <input type="text" id="regNombre" placeholder="Tu nombre *" class="input-field">
        <input type="text" id="regApellido" placeholder="Tu apellido" class="input-field">
      </div>
      <input type="email" id="regEmail" placeholder="Email *" class="input-field" autocomplete="email">
      <input type="tel" id="regTel" placeholder="Teléfono / WhatsApp" class="input-field">
      <input type="password" id="regPass" placeholder="Contraseña (mín. 6) *" class="input-field" autocomplete="new-password">
      <button onclick="doRegistro()" class="btn-primary" id="btnRegistro">Crear mi cuenta</button>
      <p id="regError" class="errmsg"></p>
      <p style="font-size:.72rem;color:var(--suave);text-align:center;">Después vas a poder dar de alta a tu mascota: te preguntamos su especie y edad y le asignamos el plan que le corresponde.</p>
    </div>
    <div class="divider"><button onclick="showScreen('loginScreen')" class="link-btn">Ya tengo cuenta</button></div>
  </div>
</div>

<!-- APP (home del titular) -->
<div id="appScreen">
  <nav class="app-nav">
    <div class="logo"><svg width="30" height="30"><use href="#mp-iso-w"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <button onclick="doLogout()" class="btn-logout">Salir</button>
  </nav>
  <div class="app-body"><div id="home"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp(window.__FB_CONFIG || {
  apiKey:"AIzaSyBW3nLFqr55xYN16rSpapqIb6yVnyKbp-4",
  authDomain:"medipet-c3a4d.firebaseapp.com",
  projectId:"medipet-c3a4d",
  storageBucket:"medipet-c3a4d.firebasestorage.app",
  messagingSenderId:"893304150807",
  appId:"1:893304150807:web:4563f00e1a2a856124b552"
});
const auth=firebase.auth(), db=firebase.firestore();
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const MC=window.MEDIPAW; // núcleo puro compartido (no se duplica lógica)

// ⚠️ TEL DE GUARDIA VETERINARIA 24hs — PLACEHOLDER. ÚNICO lugar para cambiarlo (one-liner) cuando esté el número real.
const TEL_EMERG = '0800-000-0000';

// Roles del doc usuario (compat legacy rol→roles, prestador→veterinario vía el núcleo).
function getRoles(u){
  let roles = (u && Array.isArray(u.roles) && u.roles.length) ? u.roles.slice() : (u && u.rol ? [u.rol] : []);
  return roles.map(r => r==='prestador' ? 'veterinario' : r);
}

// ── Estado único ──
const S = { view:'boot', sub:'home', cred:null, mascotaSel:0, deferredPrompt:null, caso:null, chequeo:null, historia:null };
// Dispatcher del sub-view: home | caso | cuenta | alta (embudo) | chequeo (peso) | historia (atenciones) | mismascotas (planes+servicios)
function render(){ if(S.sub==='caso') casoView(); else if(S.sub==='cuenta') cuentaView(); else if(S.sub==='alta') altaView(); else if(S.sub==='chequeo') chequeoView(); else if(S.sub==='historia') historiaView(); else if(S.sub==='mismascotas') misMascotasView(); else homeView(); }
function volverHome(){ S.sub='home'; S.caso=null; S.alta=null; S.chequeo=null; S.historia=null; render(); }

// ── Colección mascotas (fuente de verdad; reusa el núcleo) ──
async function mascGetByTitular(uid){
  const s = await db.collection('mascotas').where('titularUid','==',uid).get();
  return s.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>String(a.mascotaId||a.id).localeCompare(String(b.mascotaId||b.id)));
}

// ── Utilidades ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function v(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function showScreen(id){ ['bootScreen','loginScreen','registerScreen'].forEach(s=>{const e=document.getElementById(s);if(e){e.classList.remove('active');e.style.display=s==='bootScreen'?'none':'';}}); document.getElementById('appScreen').style.display='none'; if(id==='appScreen'){document.getElementById('appScreen').style.display='block';} else {const e=document.getElementById(id); if(e){e.style.display='';e.classList.add('active');}} }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600); }
function setErr(id,msg){ const el=document.getElementById(id); if(el) el.textContent=msg||''; }
function comprimirFoto(file,max){ max=max||480; return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let{width:w,height:h}=img; if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',.8)); }; img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
function previewFoto(input){ if(input.files&&input.files[0]){ const r=new FileReader(); r.onload=e=>{const p=document.getElementById('fotoPreview'); if(p){p.src=e.target.result;p.style.display='block';}}; r.readAsDataURL(input.files[0]); } }

// ── Auth: login / registro / logout ──
async function doLogin(){
  const email=v('loginEmail'), pass=document.getElementById('loginPass').value;
  setErr('loginError',''); if(!email||!pass){ setErr('loginError','Completá email y contraseña.'); return; }
  const btn=document.getElementById('btnLogin'); btn.disabled=true; btn.textContent='Ingresando…';
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ btn.disabled=false; btn.textContent='Ingresar'; setErr('loginError', e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found' ? 'Email o contraseña incorrectos.' : 'Error: '+e.message); }
}
async function doRegistro(){
  const nombre=v('regNombre'),apellido=v('regApellido'),email=v('regEmail'),tel=v('regTel');
  const pass=document.getElementById('regPass').value;
  setErr('regError','');
  if(!nombre||!email||!pass){ setErr('regError','Completá los campos con *.'); return; }
  if(pass.length<6){ setErr('regError','La contraseña necesita al menos 6 caracteres.'); return; }
  const btn=document.getElementById('btnRegistro'); btn.disabled=true; btn.textContent='Creando cuenta…';
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    // Cuenta SOLA (sin mascota). La mascota se da de alta por el EMBUDO (especie→edad→plan del sistema), activa.
    await db.collection('usuarios').doc(uid).set({
      uid,nombre,apellido,email,telefono:tel,
      rol:'afiliado', roles:['afiliado'], estado:'activo',
      mascotas:[],
      creadoEn:TS()
    });
  }catch(e){
    btn.disabled=false; btn.textContent='Crear mi cuenta';
    setErr('regError', e.code==='auth/email-already-in-use' ? 'Ese email ya tiene cuenta.' : 'Error: '+e.message);
  }
}
function doLogout(){ auth.signOut(); }

// ── Ruteo por rol (login único). Titular (afiliado) se queda; staff PURO → panel /app/. ──
auth.onAuthStateChanged(async user=>{
  if(!user){ S.cred=null; showScreen('loginScreen'); return; }
  showScreen('bootScreen');
  try{
    const snap=await db.collection('usuarios').doc(user.uid).get();
    if(!snap.exists){ await auth.signOut(); showScreen('loginScreen'); setErr('loginError','Tu registro está en proceso.'); return; }
    const u={uid:user.uid,...snap.data()};
    const roles=getRoles(u);
    if(!MC.esTitular(roles)){
      // Sin rol de titular. Si es staff → al panel; si no, cartel honesto. (El mixto staff+afiliado SÍ es titular → se queda.)
      if(MC.esStaff(roles)){ window.location.replace('../app/'); return; }
      renderSinAcceso(u); return;
    }
    // Es titular (afiliado). Carga sus mascotas de la colección y muestra el home. (Si además es staff, se queda acá:
    // entró explícitamente a /socio/; el panel /app/ solo rebota al afiliado PURO.)
    let mascotas=[], casos=[], comprobantes=[];
    try{ mascotas=await mascGetByTitular(user.uid); }catch(_){ }
    try{ casos=(await db.collection('casos').where('titularUid','==',user.uid).get()).docs.map(d=>({id:d.id,...d.data()})); }catch(_){ }
    try{ comprobantes=(await db.collection('comprobantes').where('titularUid','==',user.uid).get()).docs.map(d=>({id:d.id,...d.data()})); }catch(_){ }
    S.cred={ u, mascotas, casos, comprobantes }; S.mascotaSel=0; S.sub='home';
    render();
    showScreen('appScreen');
  }catch(e){ showScreen('loginScreen'); setErr('loginError','Error al cargar tu cuenta: '+e.message); }
});

function renderSinAcceso(u){
  document.getElementById('home').innerHTML = `
    <div class="seccion" style="text-align:center;">
      <div style="font-size:2.2rem;margin-bottom:8px;">🐾</div>
      <div class="stit" style="text-transform:none;font-size:1rem;">Todavía no tenés una mascota afiliada</div>
      <p style="font-size:.85rem;color:var(--suave);line-height:1.5;margin-top:6px;">Escribinos para afiliar a tu mascota y activar tu plan MEDIPaw.</p>

// El plan y la cuota los fija el sistema (MC.planPorEspecieEdad); el titular NO los elige. Las reglas los revalidan.
function genCodigo(n){ const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let t=''; const a=new Uint8Array(n); crypto.getRandomValues(a); for(let i=0;i<n;i++) t+=ch[a[i]%ch.length]; return t; }
const ESPECIE_LABEL={perro:'🐶 Perro',gato:'🐱 Gato',ave:'🐦 Ave',otros:'🐾 Otros'};

function altaEdad(x){ S.alta.edadAprox=x; S.alta.err=''; altaView(); }
function altaPaso(n){
  const a=S.alta;
  // guardar inputs visibles antes de navegar
  if(a.paso===1){ a.nombre=v('altaNombre'); }
  if(a.paso===2){ const el=document.getElementById('altaFnac'); a.fnac=el?el.value:''; }
  if(a.paso===3){ a.peso=v('altaPeso'); a.raza=v('altaRaza'); const sx=document.getElementById('altaSexo'); a.sexo=sx?sx.value:''; }
  a.err='';
  if(n>a.paso){ // validaciones al avanzar
    if(a.paso===1 && !a.nombre){ a.err='Poné el nombre de tu mascota.'; altaView(); return; }
    if(a.paso===1 && !a.especie){ a.err='Elegí la especie.'; altaView(); return; }
    if(a.paso===2 && !a.edadAprox){ a.err='Elegí la edad aproximada.'; altaView(); return; } // fecha exacta OPCIONAL, nunca traba
    if(a.paso===3){
      if(!a.peso || Number(a.peso)<=0){ a.err='Poné el peso (kg).'; altaView(); return; }
      if(!a.raza){ a.err='Poné la raza.'; altaView(); return; }
      if(!a.sexo){ a.err='Elegí el sexo.'; altaView(); return; }
    }
  }
  a.paso=n; altaView();
}
// El plan lo maneja la EDAD APROXIMADA (nunca la fecha). Fuente única MC.planPorEdadAprox.
function altaPlanCalc(){ const a=S.alta; if(!a.especie||!a.edadAprox) return null; const plan=MC.planPorEdadAprox(a.especie, a.edadAprox); return { plan, cuota:MC.planCuota(plan), franja:(a.especie==='perro'||a.especie==='gato')?MC.EDAD_APROX_LABEL[a.edadAprox]:'Básico' }; }

      <p style="font-size:.72rem;color:var(--suave);margin-top:6px;">El plan lo asigna MEDIPaw según especie y edad. No se elige a mano.</p>`;

  document.getElementById('home').innerHTML = `<div class="seccion">${barra}${cuerpo}<p class="errmsg">${esc(a.err||'')}</p>${pasoN===1?'':btnPrimario}${pasoN===1?`<button class="link-btn" onclick="volverHome()" style="margin-top:12px;">Cancelar</button>`:volver}</div>`;
}
async function finalizarAlta(){
  const a=S.alta; const p=altaPlanCalc(); if(!p){ a.err='Faltan datos.'; altaView(); return; }
  a.busy=true; altaView();
  const uid=S.cred.u.uid;
  try{
    const mascotaId='MP-'+genCodigo(8);
    const token=genCodigo(24); // crypto.getRandomValues (genCodigo) — para la ficha pública /m/{token}. La colección es la fuente.
    // Mascota ACTIVA; plan/cuota los pone el sistema por EDAD APROXIMADA (la regla los revalida por el bucket).
    const doc={
      mascotaId, titularUid:uid, nombre:a.nombre, especie:a.especie, edadAprox:a.edadAprox, raza:a.raza, sexo:a.sexo,
      plan:p.plan, cuota:p.cuota, estado:'activo', foto:'', token, servicios:[], creadoEn:TS()
    };
    // Fecha exacta OPCIONAL: solo si el titular la cargó (refina el recálculo futuro).
    if(a.fnac){ doc.fechaNacimiento=firebase.firestore.Timestamp.fromDate(new Date(a.fnac+'T00:00:00-03:00')); }
    await db.collection('mascotas').doc(mascotaId).set(doc);
    // Espejo al array embebido usuarios.mascotas[] (invariante expand/contract: el admin identifica afiliados por ahí).
    try{ const s=await db.collection('usuarios').doc(uid).get(); const ud=s.data()||{}; const arr=Array.isArray(ud.mascotas)?ud.mascotas.slice():[];
      arr.push({ nombre:a.nombre, raza:a.raza, especie:a.especie, sexo:a.sexo, plan:p.plan, mascotaId, token });
      await db.collection('usuarios').doc(uid).update({ mascotas:arr }); S.cred.u.mascotas=arr;
    }catch(_){}
    // Primer punto de la SERIE DE PESO (no es un campo que se pisa).
    try{ await db.collection('pesos').add({ mascotaId, titularUid:uid, peso:Number(a.peso), fecha:TS(), origen:'alta' }); }catch(_){}
    S.cred.mascotas=await mascGetByTitular(uid);
    S.mascotaSel=Math.max(0,S.cred.mascotas.findIndex(m=>m.mascotaId===mascotaId));
    S.sub='home'; S.alta=null; render();
    toast(a.nombre+' quedó con cobertura activa.');
  }catch(e){ a.busy=false; a.err='No se pudo dar de alta: '+e.message; altaView(); }
}

function fmtKg(n){ return Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2})+' kg'; }
function fmtFechaP(f){ const d=f&&f.toDate?f.toDate():(f&&f.seconds?new Date(f.seconds*1000):null); return d?d.toLocaleDateString('es-AR'):''; }
function origenPeso(o){ return ({alta:'cargado en el alta', titular:'lo cargaste vos', vet:'veterinario'})[o] || (o||''); }

async function cargarPesosChequeo(){
  const m=mascotaActiva(); const uid=(S.cred&&S.cred.u)?S.cred.u.uid:null;
  if(!m||!uid){ S.chequeo={serie:[]}; chequeoView(); return; }
  try{
    // titularUid EN el where: la regla `pesos` list exige resource.data.titularUid==uid por doc; sin eso rechaza la query entera.
    const snap=await db.collection('pesos').where('titularUid','==',uid).where('mascotaId','==',m.mascotaId).get();
    const serie=snap.docs.map(d=>d.data()).sort((a,b)=>tms(a.fecha)-tms(b.fecha)); // ascendente por fecha
    S.chequeo={serie};
  }catch(e){ S.chequeo={serie:[], err:'No pudimos cargar el historial de peso.'}; }
  chequeoView();
}

function chequeoView(){
  const back=`<button class="link-btn" style="margin-bottom:10px;display:inline-block;" onclick="volverHome()">‹ Volver</button>`;
  const m=mascotaActiva();
  if(!S.chequeo){ // aún sin cargar → mostrar cargando y disparar la lectura
    document.getElementById('home').innerHTML = back + `<div class="seccion"><p style="font-size:.85rem;color:var(--suave);">Cargando…</p></div>`;
    cargarPesosChequeo(); return;
  }
  const titulo=`<div class="stit" style="text-transform:none;font-size:1rem;">Chequeo y peso de ${esc(nombreMasc(m))}</div>`;
  if(!m){
    document.getElementById('home').innerHTML = back + `<div class="seccion">${titulo}<p style="font-size:.85rem;color:var(--suave);margin-top:8px;">Primero agregá una mascota.</p></div>`;
    return;
  }
  const err = S.chequeo.err ? `<p class="errmsg">${esc(S.chequeo.err)}</p>` : '';
  const serie=S.chequeo.serie||[]; const n=serie.length;
  // Peso actual = último punto. Si hay ≥2, diferencia contra el anterior (gris neutro, sin semáforo).
  let actual;
  if(n){
    const ult=serie[n-1];
    let diff='';
    if(n>=2){
      const d=Math.round((pesoNum(ult.peso)-pesoNum(serie[n-2].peso))*100)/100;
      const dTxt=(d>0?'+':'')+d.toLocaleString('es-AR',{maximumFractionDigits:2});
      diff=`<div style="font-size:.8rem;color:var(--suave);margin-top:2px;">${esc(dTxt)} kg desde la última</div>`;
    }
    actual=`<div style="text-align:center;margin:6px 0 14px;">
      <div style="font-size:2.4rem;font-weight:900;color:var(--noche);line-height:1;">${esc(fmtKg(ult.peso))}</div>
      <div style="font-size:.76rem;color:var(--suave);margin-top:4px;">${esc(fmtFechaP(ult.fecha))}</div>
      ${diff}
    </div>`;
  } else {
    actual=`<p style="font-size:.85rem;color:var(--suave);margin:6px 0 12px;">Todavía no hay mediciones. Cargá la primera abajo.</p>`;
  }
  // Historial: serie completa, más nuevo arriba.
  let hist='';
  if(n){
    const filas=[...serie].reverse().map(p=>`
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(26,95,180,.06);">
        <span style="font-weight:800;color:var(--noche);">${esc(fmtKg(p.peso))}</span>
        <span style="font-size:.74rem;color:var(--suave);">${esc(fmtFechaP(p.fecha))} · ${esc(origenPeso(p.origen))}</span>
      </div>`).join('');
    hist=`<div style="margin-top:4px;"><div class="stit" style="text-transform:none;font-size:.85rem;color:var(--suave);">Historial</div>${filas}</div>`;
  }
  const agregar=`<div style="margin-top:16px;">
    <div class="stit" style="text-transform:none;font-size:.9rem;">Agregar medición</div>
    <div class="fstack" style="margin-top:8px;">
      <input id="chequeoPeso" class="input-field" inputmode="decimal" placeholder="Peso en kg (ej. 12,5)">
      <p id="chequeoMsg" class="errmsg"></p>
      <button class="btn-primary" onclick="guardarPeso()">Guardar</button>
    </div>
  </div>`;
  document.getElementById('home').innerHTML = back + `<div class="seccion">${titulo}${err}${actual}${hist}${agregar}</div>`;
}

async function guardarPeso(){
  const m=mascotaActiva(); const uid=(S.cred&&S.cred.u)?S.cred.u.uid:null;
  const msg=document.getElementById('chequeoMsg'); if(msg) msg.textContent='';
  if(!m||!uid) return;
  // El titular escribe "12,5" con coma → coma a punto ANTES de Number(). Rechazar NaN, ≤0 y absurdos (>200 kg).
  const raw=v('chequeoPeso'); const nkg=Number(raw.replace(/,/g,'.'));
  if(!raw || !isFinite(nkg) || isNaN(nkg) || nkg<=0 || nkg>200){
    if(msg) msg.textContent='Ingresá un peso válido en kg (mayor a 0 y hasta 200).';
    return;
  }
  const btn=document.querySelector('#home .btn-primary'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    await db.collection('pesos').add({ mascotaId:m.mascotaId, titularUid:uid, peso:nkg, fecha:TS(), origen:'titular' });
    S.chequeo=null; chequeoView(); // re-lee la serie y re-renderiza
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Guardar'; }
    if(msg) msg.textContent='Error al guardar: '+e.message;
  }
}
// ── Historia (atenciones del titular) ────────────────────────────────────────
// N3: el titular ve SUS `atenciones` (safe); `casos_clinico` JAMÁS (reglas). Solo lectura, sin form, sin writes.
// Historia v1 = clínico + reintegro REGISTRADO (monto/estado informativo, sin cálculo; el motor de coberturas es aparte).
function abrirHistoria(m){ S.sub='historia'; S.historia=null; render(); }
function capitaliz(s){ s=String(s||''); return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function estadoReintegro(e){ return ({ pagado:'pagado', pendiente:'en proceso', rechazado:'rechazado' })[e] || (e||''); }

async function cargarAtencionesHistoria(){
  const m=mascotaActiva(); const uid=(S.cred&&S.cred.u)?S.cred.u.uid:null;
  if(!m||!uid){ S.historia={lista:[]}; historiaView(); return; }
  try{
    // titularUid EN el where (la regla `atenciones` list lo exige por doc). Orden por fecha en el CLIENTE
    // (desc) → dos filtros de igualdad sin orderBy en la query = SIN índice compuesto (igual que `pesos`).
    const snap=await db.collection('atenciones').where('titularUid','==',uid).where('mascotaId','==',m.mascotaId).get();
    const lista=snap.docs.map(d=>d.data()).sort((a,b)=>tms(b.fecha)-tms(a.fecha)); // más nueva arriba
    S.historia={lista};
  }catch(e){ S.historia={lista:[], err:'No pudimos cargar la historia.'}; }
  historiaView();
}

function itemAtencion(a){
  const monto=Number(a.monto)||0;
  const reintegro = monto>0
    ? `<div style="font-size:.78rem;color:var(--suave);margin-top:6px;">Reintegro: $${monto.toLocaleString('es-AR')} — ${esc(estadoReintegro(a.estado))}</div>` : '';
  const adj = (Array.isArray(a.adjuntos) && a.adjuntos.length)
    ? `<div style="font-size:.74rem;color:var(--suave);margin-top:4px;">📎 ${a.adjuntos.length} adjunto${a.adjuntos.length>1?'s':''}</div>` : '';
  return `<div style="background:white;border:1px solid rgba(26,95,180,.08);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(26,95,180,.04);">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
      <strong style="font-size:.9rem;color:var(--noche);">${esc(capitaliz(a.tipo))}</strong>
      <span style="font-size:.74rem;color:var(--suave);white-space:nowrap;">${esc(fmtFechaP(a.fecha))}</span>
    </div>
    ${a.prestadorNombre?`<div style="font-size:.74rem;color:var(--suave);margin-top:1px;">${esc(a.prestadorNombre)}</div>`:''}
    ${a.diagnostico?`<div style="font-size:.82rem;color:var(--texto);margin-top:6px;"><strong>Diagnóstico:</strong> ${esc(a.diagnostico)}</div>`:''}
    ${a.tratamiento?`<div style="font-size:.82rem;color:var(--texto);margin-top:2px;"><strong>Tratamiento:</strong> ${esc(a.tratamiento)}</div>`:''}
    ${reintegro}${adj}
  </div>`;
}

function historiaView(){
  const back=`<button class="link-btn" style="margin-bottom:10px;display:inline-block;" onclick="volverHome()">‹ Volver</button>`;
  const m=mascotaActiva();
  if(!S.historia){ document.getElementById('home').innerHTML = back + `<div class="seccion"><p style="font-size:.85rem;color:var(--suave);">Cargando…</p></div>`; cargarAtencionesHistoria(); return; }
  const titulo=`<div class="stit" style="text-transform:none;font-size:1rem;">Historia de ${esc(nombreMasc(m))}</div>`;
  if(!m){ document.getElementById('home').innerHTML = back + `<div class="seccion">${titulo}<p style="font-size:.85rem;color:var(--suave);margin-top:8px;">Primero agregá una mascota.</p></div>`; return; }
  const err=S.historia.err?`<p class="errmsg">${esc(S.historia.err)}</p>`:'';
  const lista=S.historia.lista||[];
  const cuerpo = lista.length
    ? lista.map(itemAtencion).join('')
    : `<p style="font-size:.85rem;color:var(--suave);margin-top:10px;">Todavía no hay atenciones registradas.</p>`;
  document.getElementById('home').innerHTML = back + `<div class="seccion">${titulo}${err}<div style="margin-top:10px;">${cuerpo}</div></div>`;
}

// Cómo se paga HOY (sin pasarela) — constante única, fácil de cambiar cuando entre Mercado Pago.
const PAGO_INFO = 'Por ahora el pago se coordina con MEDIPaw (transferencia o en la clínica). Todavía no se puede pagar desde la app.';
const LEYENDA_NO_FISCAL = 'Comprobantes internos de MEDIPaw. No son facturas fiscales (AFIP).';

function bloqueCuota(c){
  const cuota=MC.cuotaTitular(c.mascotas||[]);
  const pend=(c.comprobantes||[]).filter(x=>x.estado!=='pagada').length;
  return `<button class="tile" onclick="abrirCuenta()">
    <div class="t-ico">🧾</div>
    <div class="t-body"><div class="t-title">Cuota y comprobantes</div><div class="t-sub">${cuota?('$'+cuota.toLocaleString('es-AR')+'/mes'):'Sin cuota activa'}${pend?` · ${pend} pendiente${pend>1?'s':''}`:''}</div></div>
    <span class="t-arrow">›</span>
  </button>`;
}
function abrirCuenta(){ S.sub='cuenta'; render(); }
function cuentaView(){
  const c=S.cred; const ahora=Date.now();
  const activas=(c.mascotas||[]).filter(m=>MC.coberturaMascota(m).ok);
  const cuota=MC.cuotaTitular(c.mascotas||[]);
  const desglose = activas.length
    ? activas.map(m=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;"><span>${esc(m.nombre)} <span style="color:var(--suave);">· ${esc(m.plan)}</span></span><span style="font-weight:800;">$${MC.planCuota(m.plan).toLocaleString('es-AR')}</span></div>`).join('')
    : `<div style="font-size:.82rem;color:var(--suave);">No tenés mascotas con cobertura activa.</div>`;
  const comps=(c.comprobantes||[]).slice().sort((a,b)=>String(b.periodo||'').localeCompare(String(a.periodo||'')));
  const badge=(est)=>({pagada:['#dcfce7','#166534','Pagado'],vencida:['#fee2e2','#991b1b','Vencido'],pendiente:['#fef3c7','#92400e','Pendiente']}[est]);
  const compsHtml = comps.length ? comps.map(cp=>{
    const venceMs = cp.venceEl&&cp.venceEl.toMillis?cp.venceEl.toMillis():0;
    const est = MC.estadoComprobante(cp, ahora, venceMs);
    const b=badge(est);
    const venceTxt = cp.venceEl&&cp.venceEl.toDate?cp.venceEl.toDate().toLocaleDateString('es-AR'):'';
    const items=(cp.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--suave);padding:2px 0;"><span>${esc(it.mascotaNombre)} · ${esc(it.plan)}</span><span>$${(Number(it.monto)||0).toLocaleString('es-AR')}</span></div>`).join('');
    return `<div class="seccion" style="padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:800;">${esc(cp.periodo||'')}</div><div style="font-size:.7rem;color:var(--suave);">${esc(cp.nroComprobante||'')}</div></div>
        <span style="background:${b[0]};color:${b[1]};font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:100px;text-transform:uppercase;">${b[2]}</span>
      </div>
      <div style="margin:8px 0;border-top:1px solid var(--azul-pale);border-bottom:1px solid var(--azul-pale);padding:6px 0;">${items}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:.75rem;color:var(--suave);">${est==='pagada'?'Pagado':(venceTxt?('Vence '+venceTxt):'')}</span>
        <span style="font-weight:900;font-size:1.05rem;">$${(Number(cp.total)||0).toLocaleString('es-AR')}</span>
      </div>
    </div>`;
  }).join('') : `<div class="seccion"><p style="font-size:.85rem;color:var(--suave);">Todavía no tenés comprobantes emitidos.</p></div>`;
  document.getElementById('home').innerHTML =
    `<button class="link-btn" style="margin-bottom:10px;display:inline-block;" onclick="volverHome()">‹ Volver</button>
    <div class="seccion">
      <div class="stit">Tu cuota mensual</div>
      ${desglose}
      <div style="display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--azul-pale);margin-top:6px;padding-top:8px;">
        <span style="font-weight:800;">Total por mes</span><span style="font-weight:900;font-size:1.15rem;color:var(--azul);">$${cuota.toLocaleString('es-AR')}</span>
      </div>
      <div style="background:var(--azul-pale);border-radius:10px;padding:10px;margin-top:10px;font-size:.8rem;color:var(--noche);">💳 ${PAGO_INFO}</div>
    </div>
    <div class="stit" style="margin:4px 2px 8px;">Comprobantes</div>
    ${compsHtml}
    <div class="foot-note" style="margin-top:6px;">${LEYENDA_NO_FISCAL}</div>`;
}
// 9) Mis mascotas y servicios — tile VIVO → vista solo-lectura. Fuente = colección `mascotas` (S.cred.mascotas,
//    ya cargada por mascGetByTitular; JAMÁS el espejo usuarios.mascotas[]). Cobertura real la decide el NÚCLEO.
function bloqueMisMascotas(c){
  const n=(c.mascotas||[]).length;
  const sub = n ? `${n} mascota${n>1?'s':''} · planes y servicios` : 'Tus mascotas, planes y servicios';
  return `<button class="tile" onclick="abrirMisMascotas()">
    <div class="t-ico">🐾</div>
    <div class="t-body"><div class="t-title">Mis mascotas y servicios</div><div class="t-sub">${esc(sub)}</div></div>
    <span class="t-arrow">›</span>
  </button>`;
}
function abrirMisMascotas(){ S.sub='mismascotas'; render(); }
// Iconos por servicio (mismo mapeo que la ficha pública /m/). Fallback • si el key es desconocido.
const SRV_ICONO = { salud:'🩺', descuento:'🏷️', gps:'📍', tienda:'🛒', vacuna:'💉' };
// Un servicio como fila. mode: 'incluido' (cobertura real) | 'requiere' (activo pero sin plan de catálogo) | 'disponible'.
function itemServicio(s, mode){
  const ico = SRV_ICONO[s.key] || '•';
  const chip = mode==='incluido'
      ? `background:rgba(74,222,128,.18);color:#166534;` // Incluido en tu plan
      : mode==='requiere'
      ? `background:#fef3c7;color:#92400e;`               // Requiere plan activo
      : `background:#eff6ff;color:var(--azul);`;          // Disponible
  const txt = mode==='incluido' ? 'Incluido en tu plan' : mode==='requiere' ? 'Requiere plan activo' : 'Disponible';
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--azul-pale);">
    <div style="min-width:0;"><div style="font-size:.83rem;font-weight:700;">${ico} ${esc(s.nombre||'')}</div>${s.detalle?`<div style="font-size:.72rem;color:var(--suave);">${esc(s.detalle)}</div>`:''}</div>
    <span style="${chip}font-size:.62rem;font-weight:800;padding:2px 9px;border-radius:100px;white-space:nowrap;">${txt}</span>
  </div>`;
}
// Card por mascota: cabecera (nombre/raza/plan/cuota/chip estado, mismo lenguaje del carnet del header) + servicios.
function cardMisMascota(m){
  const cob = MC.coberturaMascota(m); const cuota = MC.planCuota(m.plan);
  const servicios = Array.isArray(m.servicios) ? m.servicios : [];
  const incluidos = servicios.filter(s=>s && s.estado==='activo');       // 'oculto' NO se renderiza
  const disponibles = servicios.filter(s=>s && s.estado==='disponible');
  const chipEstado = `<span style="display:inline-flex;align-items:center;gap:5px;background:${cob.ok?'rgba(74,222,128,.18)':'rgba(248,113,113,.15)'};color:${cob.ok?'#166534':'#991b1b'};font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:100px;white-space:nowrap;"><span style="width:7px;height:7px;border-radius:50%;background:${cob.ok?'#4ade80':'#f87171'};"></span>${esc(cob.chip)}</span>`;
  const head = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
      <div style="min-width:0;"><div style="font-weight:800;font-size:1rem;">${esc(m.nombre||'—')}</div><div style="font-size:.75rem;color:var(--suave);">${esc(m.raza||'')}</div></div>
      ${chipEstado}
    </div>
    <div style="font-size:.82rem;margin-top:4px;"><strong>${esc(m.plan||'Sin definir')}</strong>${cob.ok&&cuota?` · $${cuota.toLocaleString('es-AR')}/mes`:''}</div>`;
  let cuerpo;
  if(!servicios.length){
    cuerpo = `<div style="font-size:.8rem;color:var(--suave);margin-top:10px;">Tus servicios se están configurando.</div>`;
  } else {
    const secIncl = incluidos.length ? `<div style="font-size:.68rem;font-weight:800;letter-spacing:.5px;color:var(--suave);text-transform:uppercase;margin-top:12px;">Incluidos</div>${incluidos.map(s=>itemServicio(s, cob.ok?'incluido':'requiere')).join('')}` : '';
    const secDisp = disponibles.length ? `<div style="font-size:.68rem;font-weight:800;letter-spacing:.5px;color:var(--suave);text-transform:uppercase;margin-top:12px;">Disponibles</div>${disponibles.map(s=>itemServicio(s,'disponible')).join('')}` : '';
    cuerpo = (secIncl + secDisp) || `<div style="font-size:.8rem;color:var(--suave);margin-top:10px;">Tus servicios se están configurando.</div>`;
  }
  return `<div class="seccion" style="margin-bottom:12px;">${head}${cuerpo}</div>`;
}
function misMascotasView(){
  const back=`<button class="link-btn" style="margin-bottom:10px;display:inline-block;" onclick="volverHome()">‹ Volver</button>`;
  const ms=(S.cred&&S.cred.mascotas)||[];
  const titulo=`<div class="stit" style="margin:4px 2px 8px;text-transform:none;font-size:1rem;">Mis mascotas y servicios</div>`;
  const cuerpo = ms.length ? ms.map(cardMisMascota).join('')
    : `<div class="seccion"><p style="font-size:.85rem;color:var(--suave);">Todavía no tenés mascotas. Agregá la primera desde el inicio.</p></div>`;
  document.getElementById('home').innerHTML = back + titulo + cuerpo;
}

// 9) Instalar app (solo si no está instalada y hay prompt disponible).
function bloqueInstalar(){
  if(esStandalone()) return '';
  return `<div class="seccion" id="instalBlock" style="display:${S.deferredPrompt?'block':'none'};">
    <div class="stit">Instalá MEDIPaw</div>
    <p style="font-size:.82rem;color:var(--suave);margin-bottom:10px;">Tenela en tu teléfono, siempre a mano.</p>
    <button class="btn-primary" onclick="instalarApp()">Agregar a mi pantalla</button>
  </div>`;
}
function esStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
async function instalarApp(){ if(!S.deferredPrompt) return; S.deferredPrompt.prompt(); try{ await S.deferredPrompt.userChoice; }catch(_){ } S.deferredPrompt=null; const b=document.getElementById('instalBlock'); if(b) b.style.display='none'; }

// 10) Feed (placeholder por ahora; el contenido real llega más adelante).
function bloqueFeed(){
  return `<div class="seccion">
    <div class="stit">Para vos</div>
    <p style="font-size:.82rem;color:var(--suave);">Consejos de cuidado y novedades para tu mascota. <b>Pronto.</b></p>
    <div class="foot-note">Ante una emergencia, llamá directo al ${esc(TEL_EMERG)}.</div>
  </div>`;
}

// ── PWA install prompt ──
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); S.deferredPrompt=e; const b=document.getElementById('instalBlock'); if(b) b.style.display='block'; });

/* ── Service worker (SOLO en /socio/): cache versionado por deploy + skipWaiting/clients.claim ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(err=>console.warn('[sw] no se registró:',err)); });
  // Cuando el SW nuevo toma control (tras skipWaiting), recargá una vez para servir la versión fresca.
  let refrescado=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(refrescado) return; refrescado=true; window.location.reload(); });
}
</script>
