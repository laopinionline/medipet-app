  if(tab==='tienda')cargarTiendaAdmin();
}

async function cargarDashboard(){
  const el = document.getElementById('dashboard-content');
  if(!el) return;
  el.innerHTML = '<p style="color:#5a6a8a;font-size:.85rem;">Cargando...</p>';

  try {
    // F0.5: unidad de negocio = MASCOTA ACTIVA (colección), no el titular. Facturación = Σ cuota de activas.
    const [snap, masSnap] = await Promise.all([
      db.collection('usuarios').get(),
      db.collection('mascotas').get(),
    ]);
    const todos = snap.docs.map(d=>({id:d.id,...d.data()}));
    const afiliados = todos.filter(u => esAfiliado(u));
    const prestadores = todos.filter(u => getUserRoles(u).includes('veterinario'));
    const pendientes = afiliados.filter(u=>u.estado==='pendiente');

    const todasMascotasCol = masSnap.docs.map(d=>({id:d.id,...d.data()}));
    const rn = MC.resumenNegocio(todasMascotasCol);
    const todasMascotas = todasMascotasCol;            // total real de mascotas (colección)
    const planCount = rn.planCount;                    // distribución SOLO de activas
    const facturacion = rn.facturacion;                // Σ cuota de mascotas activas
    // titulares con al menos una mascota activa (para el subtítulo "en N titulares activos")
    const titularesConActiva = new Set(todasMascotasCol.filter(m=>MC.coberturaMascota(m).ok).map(m=>m.titularUid)).size;

    const ultimos = [...afiliados].sort((a,b)=>{
      const ta = a.creadoEn?.seconds||0, tb = b.creadoEn?.seconds||0;
      return tb - ta;
    }).slice(0,5);

    const planColors = {
      'MEDIPaw Urgencias':'#ef4444','MEDIPaw Joven':'#22c55e',
      'MEDIPaw Adulto':'#1A5FB4','MEDIPaw Senior':'#f59e0b','Sin definir':'#9ca3af'
    };

    let solHtml = '';
    try {
      const solSnap = await db.collection('solicitudes').orderBy('creadoEn','desc').limit(30).get();
      // F0.5: mostrar solo pendientes (las resueltas se ocultan). Etiquetar el tipo (cambio de plan / baja / interés).
      const pendSol = solSnap.docs.filter(d => (d.data().estado||'pendiente') !== 'resuelta');
      const TIPO_SOL = { cambio_plan:{txt:'Cambio de plan',bg:'#fef3c7',col:'#92400e'}, baja:{txt:'Baja',bg:'#fee2e2',col:'#991b1b'}, activacion:{txt:'Activación',bg:'#dcfce7',col:'#166534'} };
      if (pendSol.length > 0) {
        solHtml = `<div style="background:white;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
          <div style="font-size:.75rem;font-weight:800;color:#0D1B3E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;">Solicitudes pendientes (${pendSol.length})</div>
          ${pendSol.map(d => {
            const s = d.data();
            const f = s.creadoEn?.toDate?.()?.toLocaleDateString('es-AR')||'';
            const t = TIPO_SOL[s.tipo] || {txt:(s.servicioKey||'Interés'),bg:'#EBF3FC',col:'#1A5FB4'};
            const detalle = s.tipo==='cambio_plan' ? `${esc(s.mascotaNombre||'')}: ${esc(s.planActual||'—')} → <strong>${esc(s.planPedido||'—')}</strong>`
                          : s.tipo==='baja' ? `${esc(s.mascotaNombre||'')}`
                          : s.tipo==='activacion' ? `<strong>${esc(s.mascotaNombre||'')}</strong>${s.especie?` · ${esc(s.especie)}`:''}${s.edadAprox?` · ${esc(s.edadAprox)}`:''} — pide activar el plan`
                          : `${esc(s.mascotaNombre||'')} · ${esc(s.servicioKey||'')}`;
            return `<div style="padding:10px 0;border-bottom:1px solid #f5f7fa;font-size:.82rem;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <span style="background:${t.bg};color:${t.col};font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:100px;text-transform:uppercase;">${esc(t.txt)}</span>
                ${s.tipo==='activacion' && s.mascotaId
                  ? `<button onclick="activarDesdeSolicitud('${d.id}','${esc(s.mascotaId)}')" class="bmini bverde" style="background:#166534;color:#fff;font-size:.7rem;padding:4px 12px;">Activar plan</button>`
                  : `<button onclick="marcarSolicitudResuelta('${d.id}')" class="bmini" style="background:#dcfce7;color:#166534;font-size:.7rem;padding:4px 10px;">Marcar resuelta</button>`}
              </div>
              <div style="margin-top:4px;"><strong>${esc(s.solicitanteNombre||'—')}</strong>${s.nroSocio?` · ${esc(s.nroSocio)}`:''}${s.solicitanteTel?` · ${esc(s.solicitanteTel)}`:''}</div>
              <span style="color:var(--suave);">${detalle} · ${f}</span>
              ${s.nota?`<br><span style="color:#9ca3af;font-style:italic;">${esc(s.nota)}</span>`:''}
            </div>`;
          }).join('')}
        </div>`;
      }
    } catch(e) {}

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;">
        <div style="background:white;border-radius:16px;padding:20px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
          <div style="font-size:.7rem;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Mascotas activas</div>

        </div>
        <div style="background:white;border-radius:16px;padding:20px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
          <div style="font-size:.7rem;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Titulares</div>
          <div style="font-size:2.5rem;font-weight:900;color:#2272D9;line-height:1;">${afiliados.length}</div>
          <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;">${titularesConActiva} con cobertura activa</div>
        </div>
        <div style="background:white;border-radius:16px;padding:20px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
          <div style="font-size:.7rem;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Veterinarios</div>
          <div style="font-size:2.5rem;font-weight:900;color:#1d4ed8;line-height:1;">${prestadores.length}</div>
          <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;">empleados activos</div>
        </div>
        <div style="background:white;border-radius:16px;padding:20px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
          <div style="font-size:.7rem;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Facturacion estimada</div>
          <div style="font-size:1.6rem;font-weight:900;color:#22c55e;line-height:1;">$${facturacion.toLocaleString('es-AR')}</div>
          <div style="font-size:.72rem;color:#9ca3af;margin-top:4px;">/mes · Σ cuota de mascotas activas</div>
        </div>
      </div>

      ${pendientes.length > 0 ? `<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
        <span style="color:var(--ambar);font-size:1.2rem;">${icon('warn')}</span>
        <div>
          <div style="font-size:.82rem;font-weight:800;color:#92400e;">${pendientes.length} afiliado${pendientes.length>1?'s':''} pendiente${pendientes.length>1?'s':''} de activacion</div>
          <div style="font-size:.72rem;color:#92400e;opacity:.7;">Requieren revision en la tab Afiliados</div>
        </div>
      </div>` : ''}

      <div style="background:white;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
        <div style="font-size:.75rem;font-weight:800;color:#0D1B3E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;">Mascotas por plan <span style="font-weight:400;color:#9ca3af;text-transform:none;">(activas)</span></div>
        ${Object.entries(planCount).length === 0
          ? '<p style="color:#9ca3af;font-size:.82rem;">Sin mascotas activas aun.</p>'
          : Object.entries(planCount).map(([plan,count])=>{
              const total = rn.mascotasActivas || 1;
              const pctPlan = Math.round((count/total)*100);
              const col = planColors[plan]||'#9ca3af';
              return `<div style="margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                  <span style="font-size:.82rem;font-weight:700;color:#1a2340;">${plan}</span>
                  <span style="font-size:.78rem;font-weight:800;color:${col};">${count} mascota${count>1?'s':''} · ${pctPlan}%</span>
                </div>
                <div style="background:#f5f7fa;border-radius:100px;height:8px;overflow:hidden;">
                  <div style="background:${col};height:100%;width:${pctPlan}%;border-radius:100px;"></div>
                </div>
              </div>`;
            }).join('')}
      </div>

      ${solHtml}

      <div style="background:white;border-radius:16px;padding:20px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06);">
        <div style="font-size:.75rem;font-weight:800;color:#0D1B3E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;">Ultimos registros</div>
        ${ultimos.length === 0
          ? '<p style="color:#9ca3af;font-size:.82rem;">Sin registros aun.</p>'
          : ultimos.map(u=>{
              const col = u.estado==='activo'?'#22c55e':u.estado==='pendiente'?'#f59e0b':'#ef4444';
              const fecha = u.creadoEn?.toDate?.()?.toLocaleDateString('es-AR')||'—';
              return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f7fa;">
                <div>
                  <div style="font-size:.85rem;font-weight:700;color:#1a2340;">${esc(u.nombre||'')} ${esc(u.apellido||'')}</div>
                  <div style="font-size:.72rem;color:#9ca3af;">${esc(u.email||'')} · ${fecha}</div>
                </div>
                <span style="background:${col};color:white;font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap;">${(u.estado||'').toUpperCase()}</span>
              </div>`;
            }).join('')}
      </div>
    `;
  } catch(e) {
    el.innerHTML = '<p style="color:#ef4444;">Error al cargar el dashboard: '+e.message+'</p>';
  }
}

async function crearProveedor(){
  const nombre=v('provNombre'),tipo=v('provTipo'),razonSocial=v('provRazonSocial');
  const cuit=v('provCuit'),email=v('provEmail'),tel=v('provTel');
  const condiciones=v('provCondiciones'),notas=v('provNotas');
  setMsg('provMsg','',true);
  if(!nombre||!tipo){setMsg('provMsg','Completa nombre y tipo.',false);return;}
  try{
    await db.collection('prestadores').add({
      nombre, tipo, razonSocial, cuit,
      contacto:{email,telefono:tel},
      condicionesPago:condiciones,
      estado:'activo', notas,
      creadoEn:TS()
    });
    setMsg('provMsg','Prestador '+nombre+' registrado.',true);
    ['provNombre','provTipo','provRazonSocial','provCuit','provEmail','provTel','provCondiciones','provNotas'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('formNuevoProveedor').style.display='none';
    cargarProveedoresAdmin();
  }catch(e){setMsg('provMsg','Error: '+e.message,false);}
}

async function guardarCartilla(){

async function editarCartilla(id){

    set('cartId',id); set('cartNombre',p.nombre); set('cartEspecialidad',p.especialidad); set('cartDireccion',p.direccion);
    set('cartLocalidad',p.localidad); set('cartTelefono',p.telefono); set('cartHorarios',p.horarios);
    const es=document.getElementById('cartEstado'); if(es)es.value=(p.estado||'visible');
    const t=document.getElementById('cartFormTit'); if(t)t.textContent='Editar prestador';
    setMsg('cartMsg','',true); toggleFormCartilla(true);
  }catch(e){}
}

async function eliminarCartilla(id){ if(!confirm('¿Eliminar este prestador de la cartilla?'))return; try{ await db.collection('cartilla').doc(id).delete(); }catch(e){} cargarCartillaAdmin(); }

// Redimensiona la imagen a ≤200px (lado mayor) y la guarda como data-URI JPEG (~≤30KB) — no infla el doc Firestore (límite 1MB).
function previewProdFoto(input){
  const file=input.files&&input.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=()=>{
    const max=200; let w=img.width, h=img.height;
    if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
    const data=cv.toDataURL('image/jpeg',0.75);
    const hid=document.getElementById('prodFoto'); if(hid)hid.value=data;
    const pv=document.getElementById('prodFotoPreview'); if(pv){ pv.src=data; pv.style.display='block'; }
  }; img.src=e.target.result; };
  rd.readAsDataURL(file);
}

// ── COLA DE PEDIDOS (admin) — transiciones de estado + cancelación ──
// DOS EJES: estado (logística) + pago. El STOCK lo mueve el ADMIN al despachar (en_camino baja · cancelar-desde-en_camino
// reingresa · entregado no toca — ya bajó). En EFECTIVO, entregar ACREDITA el pago en el mismo acto. Todo en un batch atómico.
var PEDIDO_SIGUIENTE={ nuevo:'confirmado', confirmado:'en_camino', en_camino:'entregado' };
var PEDIDO_LABEL={ nuevo:'Nuevo', confirmado:'Confirmado', en_camino:'En camino', entregado:'Entregado', cancelado:'Cancelado' };
var PEDIDO_COLOR={ nuevo:'#0369a1', confirmado:'#7c3aed', en_camino:'#d97706', entregado:'#166534', cancelado:'#9ca3af' };
function efectoLabel(estadoDe, estadoA, metodo){
  const ef=MC.efectoStock(estadoDe, estadoA); let t='→ '+(PEDIDO_LABEL[estadoA]||estadoA);
  if(ef==='baja') t+=' (baja stock)'; else if(ef==='reingreso') t+=' (reingresa stock)';
  if(estadoA==='entregado' && metodo==='efectivo') t+=' · cobra';
  return t;
}

          ${(est!=='entregado'&&est!=='cancelado')?`<button onclick="transicionarPedido('${d.id}','cancelado')" class="bmini brojo">Cancelar${MC.efectoStock(est,'cancelado')==='reingreso'?' (reingresa stock)':''}</button>`:''}

async function transicionarPedido(id, estadoNuevo){
  try{
    const ref=db.collection('pedidos').doc(id);
    const snap=await ref.get(); if(!snap.exists)return; const p=snap.data();
    const estadoDe=p.estado||'nuevo'; const metodo=p.metodo||'efectivo';
    const ef=MC.efectoStock(estadoDe, estadoNuevo);
    if(estadoNuevo==='cancelado' && !confirm('¿Cancelar el pedido?'+(ef==='reingreso'?' El stock reingresa.':''))) return;
    if(estadoNuevo==='entregado' && metodo==='efectivo' && !confirm('¿Marcar ENTREGADO? En efectivo esto ACREDITA el pago en el mismo acto.')) return;
    const batch=db.batch();
    if(ef!=='nada'){
      const signo = ef==='baja' ? -1 : 1;
      (p.items||[]).forEach(it=>{ if(it.productoId){ batch.update(db.collection('productos').doc(it.productoId), { stock: firebase.firestore.FieldValue.increment(signo*Number(it.cant||1)), actualizadoEn:TS() }); } });
    }
    const upd={ estado:estadoNuevo, actualizadoEn:TS() };
    if(estadoNuevo==='entregado' && metodo==='efectivo') upd.pago='acreditado'; // entregar = cobrar (efectivo), un solo acto
    batch.update(ref, upd);
    await batch.commit();
    toast('Pedido → '+(PEDIDO_LABEL[estadoNuevo]||estadoNuevo)+(ef==='baja'?' · stock bajó':ef==='reingreso'?' · stock reingresó':'')+((estadoNuevo==='entregado'&&metodo==='efectivo')?' · pago acreditado':''));
  }catch(e){ toast('Error: '+e.message); }
  cargarPedidosAdmin();
}

              <input type="text" id="afilNombre" placeholder="Nombre *" class="input-field">

              <option value="MEDIPaw Adulto">MEDIPaw Adulto</option>
              <option value="MEDIPaw Senior">MEDIPaw Senior</option>
            </select>

              <button onclick="crearAfiliado()" class="btn-primary" style="flex:1;">Crear afiliado</button>
              <button onclick="toggleFormAfiliado()" class="bmini brojo" style="padding:10px 16px;">X</button>
            </div>
            <p id="afilMsg" style="font-size:.8rem;"></p>
          </div>
        </div>
        <div id="listaUsuarios"><p style="color:#5a6a8a;font-size:.85rem;">Cargando...</p></div>
      </div>
    </div>
