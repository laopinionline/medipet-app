<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDIPaw — Portal</title>
<link rel="icon" href="/socio/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="/lib/medipaw-core.js?v=20260802e"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B3E; --azul:#1A5FB4; --azul-medio:#2272D9; --azul-claro:#5BA3E8; --azul-pale:#EBF3FC;
  --noche:#0D1B3E; --ambar:#F2B84D; --ambar-suave:#FBE7C7; --rojo:#e11d48; --verde:#166534;
  --fondo:#F5F7FA; --blanco:#fff; --texto:#1a2340; --suave:#5a6a8a; --tenue:#8a95ab; --linea:#E6EAF2;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:100px;
  --sombra-sm:0 2px 10px rgba(13,27,62,.05); --sombra-md:0 8px 24px rgba(13,27,62,.08);
  --font-display:'Baloo 2',cursive; --font-body:'Nunito',sans-serif;
}
body{font-family:var(--font-body);background:var(--fondo);color:var(--texto);min-height:100vh}
.ic-pet{width:58%;height:58%;color:var(--azul);display:block}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em}
.va-icon .ic{width:1.6rem;height:1.6rem;color:var(--azul)}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(145deg,var(--noche),#1A3A7A,var(--azul))}
.screen.active{display:flex}
.auth-card{background:white;border-radius:24px;padding:36px 28px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.auth-card.tall{max-height:90vh;overflow-y:auto}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-logo{gap:4px}
.auth-logo .marca{font-family:var(--font-display);font-weight:800;font-size:1.9rem;color:var(--navy);letter-spacing:-.5px;line-height:1}
.auth-logo .marca span{color:var(--azul)}
.auth-title{font-family:var(--font-display);font-size:1.25rem;font-weight:700;margin-bottom:4px;color:var(--navy)}
.auth-sub{font-size:.8rem;color:var(--suave);margin-bottom:18px}
.fstack{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.input-field{width:100%;padding:12px 14px;border:2px solid rgba(26,95,180,.15);border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;color:var(--texto);background:var(--fondo);outline:none;transition:border-color .2s;display:block}
.input-field:focus{border-color:var(--azul-medio);background:white}
.btn-primary{width:100%;padding:13px;background:var(--azul);color:white;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:background .2s}
.btn-primary:hover:not(:disabled){background:var(--noche)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.link-btn{background:none;border:none;color:var(--azul);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:underline}
.errmsg{color:#ef4444;font-size:.8rem;margin-top:6px;font-weight:600;min-height:16px}
.divider{border-top:1px solid var(--azul-pale);margin:16px 0;padding-top:14px;text-align:center}
.foto-label{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--azul-pale);border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:700;color:var(--azul);border:2px dashed rgba(26,95,180,.2)}
#fotoPreview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-top:10px;display:none;border:3px solid var(--azul-claro)}
/* APP */
#appScreen{display:none;min-height:100vh}
.app-nav{background:var(--noche);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.app-nav .logo{display:flex;align-items:center;gap:8px}
.app-nav .logo .marca{font-family:var(--font-display);font-weight:800;font-size:1.4rem;color:white;letter-spacing:-.4px;line-height:1}
.app-nav .logo .marca span{color:var(--azul-claro)}
.nav-right{display:flex;align-items:center;gap:10px}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;padding:7px 16px;border-radius:100px;cursor:pointer}
/* ROLE SWITCHER */
.role-switcher{position:relative}
.role-switcher-btn{background:rgba(91,163,232,.15);border:1px solid rgba(91,163,232,.3);color:#5BA3E8;font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:700;padding:5px 12px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.role-switcher-btn:hover{background:rgba(91,163,232,.25)}
.role-menu{display:none;position:absolute;top:100%;right:0;margin-top:6px;background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);min-width:180px;overflow:hidden;z-index:20}
.role-menu.open{display:block}
.role-menu-item{padding:10px 16px;font-size:.82rem;font-weight:700;color:var(--texto);cursor:pointer;border-bottom:1px solid #f5f7fa;display:flex;align-items:center;gap:8px}
.role-menu-item:last-child{border-bottom:none}
.role-menu-item:hover{background:var(--azul-pale)}
.role-menu-item.active{color:var(--azul);background:var(--azul-pale)}
.app-body{max-width:600px;margin:0 auto;padding:24px 16px 80px}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.panel-rol{display:inline-block;background:var(--azul-pale);color:var(--azul);font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-bottom:6px}
.panel-rol.veterinario{background:#dbeafe;color:#1d4ed8}
.panel-rol.admin{background:#ede9fe;color:#7c3aed}
.panel-nombre{font-size:1.5rem;font-weight:900;color:var(--noche);line-height:1.2}
.panel-plan{font-size:.8rem;color:var(--suave);font-weight:600;margin-top:4px}
.mascota-foto{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--azul-claro)}
.mascota-ph{width:64px;height:64px;border-radius:50%;background:var(--azul-pale);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.carnet{background:linear-gradient(135deg,var(--azul-medio),var(--noche));border-radius:20px;padding:24px;color:white;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 40px rgba(26,95,180,.3)}
.carnet::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.05);border-radius:50%}
.cl{font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.cp{font-size:.9rem;font-weight:800;color:var(--azul-claro);margin-bottom:16px}
.cm{font-size:1.6rem;font-weight:900;line-height:1}
.cr{font-size:.7rem;opacity:.65;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.ctlbl{font-size:.65rem;opacity:.6;font-weight:700;margin-bottom:2px}
.ct{font-size:.85rem;font-weight:700}
.cchip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.12);border-radius:100px;padding:5px 12px;font-size:.75rem;font-weight:700}
.cdot{width:7px;height:7px;background:#4ade80;border-radius:50%}
.seccion{background:white;border-radius:20px;padding:20px;margin-bottom:16px;border:1px solid rgba(26,95,180,.08)}
.stit{font-size:.85rem;font-weight:800;color:var(--noche);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:4px;background:white;border-radius:16px;padding:6px;margin-bottom:16px;border:1px solid rgba(26,95,180,.08)}
.tab{flex:1;padding:10px;border:none;background:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;color:var(--suave);cursor:pointer;transition:all .2s}
.tab.active{background:var(--azul);color:white}
.uitem,.aitem{padding:14px;border-radius:12px;background:var(--fondo);margin-bottom:10px;border:1px solid rgba(26,95,180,.06)}
.bmini{padding:6px 14px;border:none;border-radius:100px;font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:800;cursor:pointer}
.bverde{background:#dcfce7;color:#166534}
.brojo{background:#fee2e2;color:#991b1b}
.pend-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.pend-tit{font-size:.75rem;font-weight:800;color:#92400e;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.form-box{background:var(--fondo);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid rgba(26,95,180,.12)}
/* Ficha mascota admin */
.ficha-srv{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--fondo);border-radius:10px;margin-bottom:6px;border:1px solid rgba(26,95,180,.06)}
.ficha-srv .srv-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ficha-srv .srv-body{flex:1;min-width:0}
.ficha-srv .srv-nm{font-size:.8rem;font-weight:700;color:var(--noche)}
.ficha-srv .srv-dt{font-size:.7rem;color:var(--suave)}
.ficha-srv select{padding:4px 8px;border:1px solid rgba(26,95,180,.2);border-radius:8px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;background:white;color:var(--texto);flex-shrink:0}
.ficha-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ficha-actions button{padding:6px 12px;border:none;border-radius:100px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--noche);color:white;padding:10px 20px;border-radius:100px;font-size:.82rem;font-weight:700;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
/* VET STYLES */
.vet-metric{background:white;border-radius:16px;padding:18px;border:1px solid rgba(26,95,180,.08);box-shadow:0 2px 8px rgba(26,95,180,.06)}
.vet-metric .vm-label{font-size:.7rem;font-weight:700;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.vet-metric .vm-value{font-size:2rem;font-weight:900;line-height:1}
.vet-metric .vm-sub{font-size:.72rem;color:#9ca3af;margin-top:4px}
.vet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.vet-action-btn{background:white;border:2px solid rgba(26,95,180,.12);border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif}
.vet-action-btn:hover{border-color:var(--azul);background:var(--azul-pale)}
.vet-action-btn .va-icon{font-size:1.8rem;margin-bottom:6px}
.vet-action-btn .va-text{font-size:.85rem;font-weight:800;color:var(--noche)}
.search-box{position:relative}
.search-box input{width:100%;padding:14px 16px;border:2px solid rgba(26,95,180,.15);border-radius:14px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;background:white;outline:none}
.search-box input:focus{border-color:var(--azul-medio)}
.hc-entry{padding:14px;border-radius:12px;background:var(--fondo);margin-bottom:10px;border:1px solid rgba(26,95,180,.06);cursor:pointer;transition:border-color .2s}
.hc-entry:hover{border-color:var(--azul-claro)}
.hc-tipo{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 9px;border-radius:100px;letter-spacing:.2px;background:var(--azul-pale);color:var(--azul)}
.tipo-consulta{background:#dbeafe;color:#1d4ed8}
.tipo-vacuna{background:#dcfce7;color:#166534}
.tipo-estudio{background:#fef3c7;color:#92400e}
.tipo-cirugia{background:#fce7f3;color:#9d174d}
.tipo-urgencia{background:#fee2e2;color:#991b1b}
.cobertura-ok{background:var(--azul-pale);border:1px solid #bcd6f2;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.cobertura-no{background:#F1F3F7;border:1px solid var(--linea);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.cobertura-ok svg,.cobertura-no svg{width:22px;height:22px;flex-shrink:0}
.cobertura-ok svg{color:var(--azul)}.cobertura-no svg{color:var(--tenue)}
@media(max-width:500px){.frow{grid-template-columns:1fr}.auth-card{padding:28px 18px}.vet-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- Símbolos MEDIPaw (identidad v1): cachorro + iconografía monolínea del staff (mismo lenguaje del socio). -->
<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <symbol id="paw" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 84 C69 84 79 73 79 56 C79 44 72 38 63 37 C58 30 50 31 50 31 C50 31 42 30 37 37 C28 38 21 44 21 56 C21 73 31 84 50 84 Z"/>
      <path d="M37 37 C30 23 41 19 46 26 C48 29 47 33 46 36"/><path d="M63 37 C70 23 59 19 54 26 C52 29 53 33 54 36"/>
      <path d="M50 59 v4"/><path d="M41 66 C46 73 54 73 59 66"/>
      <circle cx="40" cy="53" r="3.3" fill="currentColor" stroke="none"/><circle cx="60" cy="53" r="3.3" fill="currentColor" stroke="none"/>
    </g></symbol>
    <symbol id="ic-mascotas" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="16" rx="4.2" ry="3.4"/><circle cx="6.6" cy="11.2" r="1.7"/><circle cx="10" cy="8" r="1.7"/><circle cx="14" cy="8" r="1.7"/><circle cx="17.4" cy="11.2" r="1.7"/></g></symbol>
    <symbol id="ic-vet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8-7 9.5C8 19 5 15.4 5 11V6z"/><path d="M12 9v5M9.5 11.5h5"/></g></symbol>
    <symbol id="ic-config" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></g></symbol>
    <symbol id="ic-buscar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></g></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4 10-10"/></g></symbol>
    <symbol id="ic-dash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></g></symbol>
    <symbol id="ic-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".4"/></g></symbol>
    <symbol id="ic-adjunto" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.2 3.2 0 0 1 4.6 4.6l-8 8a1.4 1.4 0 0 1-2-2l7.5-7.5"/></g></symbol>
  </defs>
</svg>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="auth-card">
    <div class="auth-logo"><svg width="40" height="40" style="color:var(--azul);stroke-width:5"><use href="#paw"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Ingresa a tu cuenta</div>
    <div class="auth-sub">Afiliados · Veterinarios · Administradores</div>
    <div class="fstack">
      <input type="email" id="loginEmail" placeholder="Email" class="input-field">
      <input type="password" id="loginPass" placeholder="Contrasena" class="input-field" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()" class="btn-primary" id="btnLogin">Ingresar</button>
      <p id="loginError" class="errmsg"></p>
    </div>
    <div class="divider">
      <p style="font-size:.8rem;color:var(--suave);margin-bottom:8px;">Todavia no tenes plan?</p>
      <button onclick="showScreen('registerScreen')" class="link-btn">Afiliarme a MEDIPaw</button>
    </div>
  </div>
</div>

<!-- REGISTRO -->
<div id="registerScreen" class="screen">
  <div class="auth-card tall" style="max-width:480px;">
    <div class="auth-logo"><svg width="40" height="40" style="color:var(--azul);stroke-width:5"><use href="#paw"/></svg><div class="marca">MEDI<span>Paw</span></div></div>
    <div class="auth-title">Afiliate a MEDIPaw</div>
    <div class="auth-sub">Completa tus datos y los de tu mascota</div>
    <div class="fstack">
      <div class="frow">
        <input type="text" id="regNombre" placeholder="Nombre *" class="input-field">
        <input type="text" id="regApellido" placeholder="Apellido" class="input-field">
      </div>
      <input type="email" id="regEmail" placeholder="Email *" class="input-field">
      <input type="tel" id="regTel" placeholder="Telefono / WhatsApp" class="input-field">
      <div>
        <label style="font-size:0.8rem;font-weight:700;display:block;margin-bottom:4px;color:var(--texto);">Fecha de nacimiento *</label>
        <input type="date" id="regFechaNac" class="input-field">
      </div>
      <input type="password" id="regPass" placeholder="Contrasena (min. 6 caracteres) *" class="input-field">
      <div style="border-top:1px solid var(--azul-pale);padding-top:12px;">
        <p style="font-size:.75rem;font-weight:800;color:var(--noche);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Tu mascota</p>
        <div class="frow">
          <input type="text" id="regMascota" placeholder="Nombre *" class="input-field">
          <input type="text" id="regRaza" placeholder="Raza" class="input-field">
        </div>
      <div>
        <label style="font-size:0.8rem;font-weight:700;display:block;margin-bottom:4px;color:var(--texto);">Fecha de nacimiento de la mascota</label>
        <input type="date" id="regFechaMascota" class="input-field">
      </div>
      <select id="regPlan" class="input-field" style="margin-top:8px;">
        <option value="">Plan de la mascota...</option>
        <option value="MEDIPaw Urgencias">MEDIPaw Urgencias — $23.988/mes</option>
        <option value="MEDIPaw Básico">MEDIPaw Básico — $40.000/mes</option>
        <option value="MEDIPaw Joven">MEDIPaw Joven — $58.788/mes</option>
        <option value="MEDIPaw Adulto">MEDIPaw Adulto — $54.388/mes</option>
        <option value="MEDIPaw Senior">MEDIPaw Senior — $70.788/mes</option>
      </select>
      <div style="margin-top:8px;">
        <label class="foto-label" for="regFoto">Foto de tu mascota (opcional)</label>
        <input type="file" id="regFoto" accept="image/*" style="display:none" onchange="previewFoto(this)">
        <img id="fotoPreview" src="" alt="Preview">
        <p style="font-size:.72rem;color:var(--suave);margin-top:6px;">Aparecera en el carnet de tu mascota.</p>
      </div>
      </div>
      <div style="border-top:1px solid var(--azul-pale);padding-top:12px;">
        <p style="font-size:.75rem;font-weight:800;color:var(--noche);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Tu foto (opcional)</p>
        <label class="foto-label" for="regFotoTitular">Tu foto de perfil</label>
        <input type="file" id="regFotoTitular" accept="image/*" style="display:none" onchange="previewFotoTitular(this)">
        <img id="fotoTitularPreview" src="" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-top:8px;display:none;border:3px solid #5BA3E8;">
      </div>
      <button onclick="doRegistro()" class="btn-primary" id="btnRegistro">Crear mi cuenta</button>
      <p id="regError" class="errmsg"></p>
    </div>
    <div class="divider"><button onclick="showScreen('loginScreen')" class="link-btn">Ya tengo cuenta</button></div>
  </div>
</div>

<!-- APP -->

async function mascGetByTitular(uid){
  const s = await db.collection('mascotas').where('titularUid','==',uid).get();
  return s.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>String(a.mascotaId||a.id).localeCompare(String(b.mascotaId||b.id)));
}
async function mascGet(mascotaId){
  if(!mascotaId) return null;
  const d = await db.collection('mascotas').doc(mascotaId).get();
  return d.exists ? {id:d.id,...d.data()} : null;
}
async function mascGetAll(){

/* ESPEJO (expand/contract F0.5): el admin sigue operando el array embebido usuarios.mascotas[] y acá
   se refleja a la colección (fuente de verdad para vet/carnet/dashboard). PRESERVA el estado/cuota ya
   fijados en la colección (no re-deriva del titular en cada edición); una mascota NUEVA nace 'suspendido'.
   Solo admin (las reglas exigen isAdmin para tocar plan/estado/cuota). El array embebido se retira en el próximo tramo. */
async function espejarMascotasEnColeccion(uid){
  const snap = await db.collection('usuarios').doc(uid).get();
  if(!snap.exists) return;
  const u = {uid, ...snap.data()};
  const embebidas = u.mascotas || [];
  for(let i=0;i<embebidas.length;i++){
    const m = embebidas[i];
    const mascotaId = m.mascotaId || (u.nroSocio ? MC.generarMascotaId(u.nroSocio, i) : '');
    if(!mascotaId) continue;
    const ref = db.collection('mascotas').doc(mascotaId);
    const cur = await ref.get();
    const descriptivo = { titularUid:uid, nombre:m.nombre||'', raza:m.raza||'', fechaNacimiento:m.fechaNacimiento||'', foto:m.foto||'', plan:m.plan||'Sin definir', token:m.token||'', servicios:m.servicios||[] };
    if(cur.exists){
      const est = cur.data().estado || 'suspendido';
      await ref.set({ ...descriptivo, cuota: est==='activo' ? MC.planCuota(m.plan) : 0 }, {merge:true});
    } else {
      await ref.set({ ...descriptivo, mascotaId, estado:'suspendido', cuota:0, creadoEn: u.creadoEn || TS() }, {merge:true});
    }
  }
}
// Activa/suspende la COBERTURA de todas las mascotas de un titular (lo dispara la activación del titular).
async function activarMascotasDe(uid, estado){
  const s = await db.collection('mascotas').where('titularUid','==',uid).get();
  const batch = db.batch();
  s.docs.forEach(d=>{ const m=d.data(); batch.update(d.ref, { estado, cuota: estado==='activo' ? MC.planCuota(m.plan) : 0 }); });
  if(!s.empty) await batch.commit();
}

// Prioridad para vista por defecto: admin > veterinario > afiliado
// TRAMO A (split): /app/ es SOLO staff. El titular PURO vive en /socio/. STAFF = roles que trabajan acá.

// Obtener roles del usuario (backward-compatible con campo `rol` string)
function getUserRoles(data) {
  let roles;
  if (data.roles && Array.isArray(data.roles) && data.roles.length > 0) {
    roles = [...data.roles];
  } else if (data.rol) {
    // Migración: rol string → roles array
    roles = [data.rol];
    if (data.rol !== 'afiliado' && !roles.includes('afiliado')) {
      roles.push('afiliado');
    }
  } else {
    return ['afiliado'];
  }
  // Migración: 'prestador' → 'veterinario'
  return roles.map(r => r === 'prestador' ? 'veterinario' : r);
}

// Elegir rol por defecto al login
function getDefaultRole(roles) {
  for (const r of ROLE_PRIORITY) {
    if (roles.includes(r)) return r;
  }
  return 'afiliado';
}

function generarToken() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let t = '';
  const arr = new Uint8Array(24);
  crypto.getRandomValues(arr);
  for (let i = 0; i < 24; i++) t += chars[arr[i] % chars.length];
  return t;
}

function generarMascotaId(nroSocio, index) {
  const num = nroSocio ? nroSocio.replace('MP-','') : '0000';
  return 'MP-' + num + '-' + String(index + 1).padStart(2, '0');
}

      ${r==='admin'?icon('config'):r==='veterinario'?icon('vet'):icon('mascotas')} ${ROLE_LABELS[r]}

// AUTH STATE
auth.onAuthStateChanged(async user=>{
  if(user){
    try{
      const snap=await db.collection('usuarios').doc(user.uid).get();
      if(snap.exists){
        const data = {uid:user.uid,...snap.data()};
        // Migración: rol→roles + 'prestador'→'veterinario'. NO-FATAL: por el fix (a) el dueño ya no puede
        // escribir `roles` en su propio doc; la persistencia es best-effort (el mapeo local igual rige la sesión,
        // y las reglas aceptan 'prestador' legacy). Un write denegado NO debe romper el login.
        const rolesActuales = data.roles && Array.isArray(data.roles) ? data.roles : null;
        const necesitaMigrar = !rolesActuales || rolesActuales.includes('prestador');
        if (necesitaMigrar) {
          const roles = getUserRoles(data); // ya mapea prestador→veterinario
          data.roles = roles;
          try { await db.collection('usuarios').doc(user.uid).update({ roles }); } catch(_) { /* denegado por reglas: solo admin migra roles ahora */ }
        }
        currentUserData = data;
        const roles = getUserRoles(data);
        // TRAMO A: el titular PURO (sin rol de staff) no trabaja en el panel → lo mandamos a su PWA /socio/.
        if (!MC.esStaff(roles)) { window.location.replace('../socio/'); return; }
        const rolesStaff = roles.filter(r => STAFF.includes(r));
        activeRole = getDefaultRole(roles); // ROLE_PRIORITY solo-staff → nunca 'afiliado'
        showScreen('appScreen');
        setupRoleSwitcher(rolesStaff); // el switcher del panel muestra SOLO roles de staff
        renderPanel(data);
      } else {
        setMsg('loginError','Tu registro esta siendo procesado.',false);
        await auth.signOut();
        showScreen('loginScreen');
      }
    }catch(e){setMsg('loginError','Error al cargar perfil: '+e.message,false);showScreen('loginScreen');}
  }else{showScreen('loginScreen');}
});

function comprimirFoto(file,MAX=300){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// REGISTRO (auto-registro siempre como afiliado)
async function doRegistro(){
  const nombre=v('regNombre'),apellido=v('regApellido'),email=v('regEmail'),tel=v('regTel');
  const pass=document.getElementById('regPass').value;
  const mascotaNombre=v('regMascota'),mascotaRaza=v('regRaza'),plan=v('regPlan');
  const fechaMascota=document.getElementById('regFechaMascota')?.value||'';
  const fotoTitularEl=document.getElementById('regFotoTitular');
  const fechaNac=document.getElementById('regFechaNac')?.value||'';
  const fotoInput=document.getElementById('regFoto');
  const btn=document.getElementById('btnRegistro');
  setMsg('regError','',true);
  if(!nombre||!email||!pass||!mascotaNombre){setMsg('regError','Completa los campos obligatorios (*).',false);return;}
  if(pass.length<6){setMsg('regError','La contrasena debe tener al menos 6 caracteres.',false);return;}
  btn.textContent='Creando cuenta...';btn.disabled=true;
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    let fotoURL='';
    if(fotoInput.files&&fotoInput.files[0]){
      try{ fotoURL=await comprimirFoto(fotoInput.files[0]); }catch(fe){fotoURL='';}
    }
    let fotoTitularURL='';
    if(fotoTitularEl&&fotoTitularEl.files&&fotoTitularEl.files[0]){
      try{ fotoTitularURL=await comprimirFoto(fotoTitularEl.files[0]); }catch(fe){fotoTitularURL='';}
    }
    const token = generarToken();
    const mascota = {
      nombre:mascotaNombre, raza:mascotaRaza, fechaNacimiento:fechaMascota,
      plan:plan||'Sin definir', foto:fotoURL,
      mascotaId: '',
      token: token,
      servicios: CATALOGO_SERVICIOS.map(s => ({...s}))
    };
    await db.collection('usuarios').doc(uid).set({
      uid,nombre,apellido,email,telefono:tel,fechaNacimiento:fechaNac,
      fotoTitular:fotoTitularURL,
      rol:'afiliado', roles:['afiliado'],
      estado:'pendiente',
      mascotas:[mascota],
      creadoEn:TS()
    });
  }catch(e){
    btn.textContent='Crear mi cuenta';btn.disabled=false;
    if(e.code==='auth/email-already-in-use')setMsg('regError','Ese email ya esta registrado.',false);
    else if(e.code==='auth/weak-password')setMsg('regError','Contrasena muy debil.',false);
    else setMsg('regError','Error: '+e.message,false);
  }
}

async function agregarMascota(uid){
  const nombre=v('newMascotaNombre'),raza=v('newMascotaRaza');
  const fecha=document.getElementById('newMascotaFecha')?.value||'';
  const plan=v('newMascotaPlan');
  const fotoEl=document.getElementById('newMascotaFoto');
  const msg=document.getElementById('mascotaMsg');
  if(msg) msg.textContent='';
  if(!nombre){if(msg){msg.textContent='Ingresa el nombre.';msg.style.color='#ef4444';}return;}
  let foto='';
  if(fotoEl&&fotoEl.files&&fotoEl.files[0]){
    try{ foto=await comprimirFoto(fotoEl.files[0]); }catch(e){foto='';}
  }
  try{
    const snap=await db.collection('usuarios').doc(uid).get();
    const ud=snap.data();
    const mascotas=ud.mascotas?[...ud.mascotas]:[];

    mascotas.push({
      nombre, raza, fechaNacimiento:fecha, plan:plan||'Sin definir', foto,

    // F0.5: la mascota nace en la colección SIN cobertura ('suspendido', cuota 0) hasta que admin la active.
    if (mascotaId) {

        mascotaId, titularUid:uid, nombre, raza, fechaNacimiento:fecha, foto,
        plan:plan||'Sin definir', cuota:0, estado:'suspendido', token,
        servicios: CATALOGO_SERVICIOS.map(s => ({...s})), creadoEn: TS()
      }, {merge:true});
    }
    if(msg){msg.textContent='+ '+nombre+' agregada. Queda pendiente de activación por MEDIPaw.';msg.style.color='#22c55e';}
    await refrescarAfiliado();
  }catch(e){if(msg){msg.textContent='Error: '+e.message;msg.style.color='#ef4444';}}
}

// F0.5: cambio de plan = acción de ADMIN (sensible: mueve la cuota). Escribe embebido + espeja a la
// colección (plan + cuota si la mascota está activa) + sincroniza ficha pública. Recarga la lista admin.
async function cambiarPlanMascota(uid, index, nuevoPlan) {
  if (!nuevoPlan) return;
  try {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    const mascotas = [...(ud.mascotas || [])];
    mascotas[index] = { ...mascotas[index], plan: nuevoPlan };
    await db.collection('usuarios').doc(uid).update({ mascotas });
    const mascotaId = mascotas[index].mascotaId || (ud.nroSocio ? generarMascotaId(ud.nroSocio, index) : '');
    if (mascotaId) {
      const ref = db.collection('mascotas').doc(mascotaId);
      const cur = await ref.get();
      const est = cur.exists ? (cur.data().estado || 'suspendido') : 'suspendido';
      await ref.set({ plan: nuevoPlan, cuota: est==='activo' ? MC.planCuota(nuevoPlan) : 0 }, { merge: true });
    }
    if (mascotas[index].token) {
      await syncMascotaPublica({ ...ud, uid }, mascotas[index], index);
    }
    cargarUsuariosAdmin();
    if (typeof cargarDashboard === 'function' && document.getElementById('dashboard-content')) { try { cargarDashboard(); } catch(e){} }

}

// F0.5 + FREEMIUM (Fase 4): control de COBERTURA por mascota (admin). Al ACTIVAR una mascota FREE (o sin plan de
// catálogo), el SISTEMA le asigna plan+cuota por especie/edad (invariante #4: el titular nunca eligió plan; ni lo
// trajo) y crea el primer punto de la serie de peso desde `pesoInicial` (el embudo free lo guardó porque las reglas
// le bloquean el peso al titular free). Suspender/baja NO tocan el plan (para reactivar con el mismo).
function planParaActivar(m){
  if(!m) return 'MEDIPaw Básico';
  if(m.especie && m.fechaNacimiento && m.fechaNacimiento.toMillis) return MC.planPorEspecieEdad(m.especie, m.fechaNacimiento.toMillis(), Date.now());
  return MC.planPorEdadAprox(m.especie, m.edadAprox); // free siempre trae edadAprox (embudo)
}
async function cambiarEstadoMascota(mascotaId, estado) {
  if (!mascotaId) return;
  try {
    const ref = db.collection('mascotas').doc(mascotaId);
    const cur = await ref.get();
    if (!cur.exists) { alert('Esa mascota todavía no está en la colección (activá al titular primero).'); return; }
    const m = cur.data();
    const upd = { estado };
    if (estado === 'activo') {
      const plan = MC.planEnCatalogo(m.plan) ? m.plan : planParaActivar(m); // free/'Sin definir' → plan por especie/edad
      upd.plan = plan; upd.cuota = MC.planCuota(plan);
      if (!Array.isArray(m.servicios) || !m.servicios.length) upd.servicios = MC.plantillaServicios();
    } else {
      upd.cuota = 0;
    }
    await ref.set(upd, { merge: true });
    // Primer punto de peso desde pesoInicial (una sola vez, solo al activar). El titular free no pudo cargarlo (reglas).
    if (estado === 'activo' && Number(m.pesoInicial) > 0) {
      try {
        const yaHay = await db.collection('pesos').where('mascotaId','==',mascotaId).limit(1).get();
        if (yaHay.empty) await db.collection('pesos').add({ mascotaId, titularUid: m.titularUid||'', peso: Number(m.pesoInicial), fecha: TS(), origen: 'activacion' });
      } catch(e) { /* no bloquea la activación */ }
    }
    // Reflejar estado (y plan si se asignó) a la ficha pública si tiene token.
    if (m.token) { try { await db.collection('mascotas_publicas').doc(m.token).update({ estado, plan: upd.plan || m.plan }); } catch(e) {} }
    cargarUsuariosAdmin();
    if (typeof cargarDashboard === 'function' && document.getElementById('dashboard-content')) { try { cargarDashboard(); } catch(e){} }
  } catch(e) { alert('Error al cambiar estado: ' + e.message); }
}
// FREEMIUM: activar directamente desde una solicitud tipo 'activacion' (reusa cambiarEstadoMascota → plan por
// especie/edad + estado activo + primer peso) y marca la solicitud resuelta.
async function activarDesdeSolicitud(solicitudId, mascotaId){
  if(!mascotaId){ alert('La solicitud no tiene mascota asociada.'); return; }
  await cambiarEstadoMascota(mascotaId, 'activo');
  try { await db.collection('solicitudes').doc(solicitudId).update({ estado:'resuelta', resueltaEn: TS() }); } catch(e){}
  try { cargarDashboard(); } catch(e){}
}

// ── SYNC MASCOTA PUBLICA ──
async function syncMascotaPublica(userData, mascota, index) {
  if (!mascota.token) return;
  const nroSocio = userData.nroSocio || '';
  const mascotaId = mascota.mascotaId || generarMascotaId(nroSocio, index);
  // CHECK DE COLISIÓN (el titular setea token en el create; podría poner el de OTRA mascota para pisarle la ficha).
  // Si ya existe una ficha pública con ese token para OTRO mascotaId → abortar (no la pisamos).
  try {
    const prev = await db.collection('mascotas_publicas').doc(mascota.token).get();
    if (prev.exists && prev.data().mascotaId && prev.data().mascotaId !== mascotaId) {
      throw new Error('El código de la ficha ya pertenece a otra mascota (' + prev.data().mascotaId + '). Regenerá el token de esta mascota.');
    }
  } catch(e) { if (/ya pertenece/.test(e.message)) throw e; /* error de red al leer: seguimos (set con merge no reasigna mascotaId ajeno igual, pero preferimos abortar arriba) */ }
  // F0.5: el estado de la ficha pública es el de LA MASCOTA (colección), no el del titular.
  let estado = 'suspendido';
  try { const md = await mascGet(mascotaId); if (md && md.estado) estado = md.estado; } catch(e) {}
  await db.collection('mascotas_publicas').doc(mascota.token).set({
    nombre: mascota.nombre || '',
    raza: mascota.raza || '',
    fechaNacimiento: mascota.fechaNacimiento || '',
    foto: mascota.foto || '',
    plan: mascota.plan || '',
    estado: estado,
    nroSocio: nroSocio,
    titularNombre: (userData.nombre || '') + ' ' + (userData.apellido || ''),
    mascotaId: mascotaId,
    servicios: mascota.servicios || [],
    actualizadoEn: TS()
  });
}

// ── ADMIN: FICHA DE MASCOTA ──
function ensureMascotaFields(mascota, nroSocio, index) {
  let changed = false;
  // El TOKEN ya NO se genera acá (la colección `mascotas` es la fuente; el embudo lo crea, y el backfill movió los viejos).
  if (!mascota.mascotaId && nroSocio) { mascota.mascotaId = generarMascotaId(nroSocio, index); changed = true; }
  if (!mascota.servicios || mascota.servicios.length === 0) {
    mascota.servicios = CATALOGO_SERVICIOS.map(s => ({...s}));
    changed = true;
  }
  return { mascota, changed };
}

async function adminGuardarServicios(uid, index) {
  try {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    const mascotas = [...(ud.mascotas || [])];
    const m = mascotas[index];
    const srvEls = document.querySelectorAll(`[data-srv-uid="${uid}"][data-srv-idx="${index}"]`);
    srvEls.forEach(sel => {
      const key = sel.dataset.srvKey;
      const srv = m.servicios.find(s => s.key === key);
      if (srv) srv.estado = sel.value;
    });
    mascotas[index] = m;
    await db.collection('usuarios').doc(uid).update({ mascotas });
    await espejarMascotasEnColeccion(uid); // F0.5: reflejar servicios/token a la colección
    if (m.token) {
      await syncMascotaPublica({ ...ud, uid }, m, index);
    }
    toast('Servicios guardados y ficha publica sincronizada');
  } catch(e) { alert('Error: ' + e.message); }
}

async function adminRegenerarToken(uid, index) {
  if (!confirm('Regenerar el token? El enlace anterior dejara de funcionar.')) return;
  try {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    const mascotas = [...(ud.mascotas || [])];
    const oldToken = mascotas[index].token;
    const newToken = generarToken();
    mascotas[index].token = newToken;
    await db.collection('usuarios').doc(uid).update({ mascotas });
    if (oldToken) {
      try { await db.collection('mascotas_publicas').doc(oldToken).delete(); } catch(e) {}
    }
    await espejarMascotasEnColeccion(uid); // F0.5: reflejar el nuevo token a la colección
    await syncMascotaPublica({ ...ud, uid }, mascotas[index], index);
    toast('Token regenerado');
    cargarUsuariosAdmin();
  } catch(e) { alert('Error: ' + e.message); }
}

// Genera/actualiza la ficha pública (/m/{token}) de una mascota de la COLECCIÓN (fuente). Solo admin (reglas).
// Sin Cloud Functions no nace sola en el alta del titular → el admin la publica desde acá. El token viene de la
// colección (lo creó el embudo); si faltara, se genera. syncMascotaPublica hace el check de colisión.
async function generarFichaPublica(mascotaId) {
  try {
    const m = await mascGet(mascotaId);
    if (!m) { alert('No encontré la mascota en la colección.'); return; }
    if (!m.token) { const t = generarToken(); await db.collection('mascotas').doc(mascotaId).set({ token: t }, { merge: true }); m.token = t; }
    let userData = { uid: m.titularUid, nombre: '', apellido: '', nroSocio: '' };
    if (m.titularUid) { try { const s = await db.collection('usuarios').doc(m.titularUid).get(); if (s.exists) userData = { uid: m.titularUid, ...s.data() }; } catch(e) {} }
    await syncMascotaPublica(userData, m, 0); // usa m.token (colección) + check de colisión
    toast('Ficha pública lista: ' + PUBLIC_BASE + m.token);
    cargarUsuariosAdmin();
  } catch(e) { alert('Error: ' + e.message); }
}

// ── VET: BUSCAR PACIENTE ──
let vetSearchTimeout = null;
function vetBuscar() {
  clearTimeout(vetSearchTimeout);
  vetSearchTimeout = setTimeout(vetEjecutarBusqueda, 400);
}

function normBusqueda(str) {
  return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

async function vetEjecutarBusqueda() {
  const q = normBusqueda(v('vetSearchInput'));
  const lista = document.getElementById('vetSearchResults');
  if (!lista) return;
  if (q.length < 2) { lista.innerHTML = '<p style="color:#9ca3af;font-size:.82rem;">Ingresa al menos 2 caracteres.</p>'; return; }
  lista.innerHTML = '<p style="color:#5a6a8a;font-size:.82rem;">Buscando...</p>';

  try {
    // F0.5: la cobertura se valida POR MASCOTA (colección mascotas), no por el estado del titular.
    const [usSnap, masSnap] = await Promise.all([
      db.collection('usuarios').get(),
      db.collection('mascotas').get(),
    ]);
    const titulares = {};
    usSnap.docs.forEach(d => { titulares[d.id] = {id:d.id, ...d.data()}; });
    const mascotasPorTitular = {};
    masSnap.docs.forEach(d => {
      const m = {id:d.id, ...d.data()};
      (mascotasPorTitular[m.titularUid] = mascotasPorTitular[m.titularUid] || []).push(m);
    });

    // Un titular entra al resultado si su nombre / nroSocio / o alguna de sus mascotas matchea.
    const resultados = Object.values(titulares).filter(u => {
      if (!getUserRoles(u).includes('afiliado')) return false;
      const nombre = normBusqueda((u.nombre||'') + ' ' + (u.apellido||''));
      const nro = (u.nroSocio||'').toLowerCase();
      const masc = mascotasPorTitular[u.id] || [];
      const mascotasMatch = masc.some(m => normBusqueda(m.nombre||'').includes(q));
      return nombre.includes(q) || nro.includes(q) || mascotasMatch;
    });

    if (resultados.length === 0) {
      lista.innerHTML = '<p style="color:#9ca3af;font-size:.82rem;">No se encontraron afiliados.</p>';
      return;
    }

    lista.innerHTML = resultados.map(u => {
      const mascotas = (mascotasPorTitular[u.id] || []).sort((a,b)=>String(a.mascotaId||'').localeCompare(String(b.mascotaId||'')));
      return `<div class="uitem">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <strong>${esc(u.nombre||'')} ${esc(u.apellido||'')}</strong>
              ${u.nroSocio?`<span style="background:#EBF3FC;color:#1A5FB4;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:100px;">${esc(u.nroSocio)}</span>`:''}
            </div>
            <div style="font-size:.7rem;color:var(--suave);margin-top:2px;">Titular / responsable — la cobertura es de cada mascota</div>
          </div>
        </div>
        ${mascotas.length > 0 ? `
          <div style="margin-top:12px;">
            <div style="font-size:.72rem;font-weight:800;color:var(--suave);text-transform:uppercase;margin-bottom:8px;">Mascotas (${mascotas.length})</div>
            ${mascotas.map(m => {
              const c = MC.coberturaMascota(m);
              const mMatch = normBusqueda(m.nombre||'').includes(q);
              const brd = mMatch ? 'border:2px solid #5BA3E8;background:#EBF3FC;' : 'border:1px solid rgba(26,95,180,.06);background:var(--fondo);';
              return `
              <div style="padding:10px;border-radius:12px;margin-bottom:6px;cursor:pointer;${brd}" onclick="vetVerHistoria('${m.mascotaId||''}')">
                <div style="display:flex;align-items:center;gap:10px;">
                  ${m.foto
                    ? `<img src="${esc(m.foto)}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #5BA3E8;">`
                    : `<div style="width:36px;height:36px;border-radius:50%;background:${mMatch?'white':'#EBF3FC'};display:flex;align-items:center;justify-content:center;font-size:.9rem;"><svg class="ic-pet"><use href="#ic-mascotas"/></svg></div>`}
                  <div style="flex:1;">
                    <div style="font-size:.85rem;font-weight:700;">${esc(m.nombre||'—')}${mMatch?' <span style="color:var(--azul)">'+icon('check')+'</span>':''}</div>
                    <div style="font-size:.72rem;color:var(--suave);">${esc(m.raza||'')} ${m.mascotaId?'· '+esc(m.mascotaId):''}</div>
                  </div>
                  <div style="font-size:.72rem;font-weight:700;color:var(--azul);">${esc(m.plan||'Sin plan')}</div>
                  <span style="font-size:.8rem;color:var(--suave);">&rarr;</span>
                </div>
                <div class="${c.ok?'cobertura-ok':'cobertura-no'}" style="margin-top:8px;">
                  <span style="font-size:1.1rem;">${c.ok?'<span style="color:var(--azul)">'+icon('check')+'</span>':'<span style="color:var(--tenue)">'+icon('dash')+'</span>'}</span>
                  <div>
                    <div style="font-size:.8rem;font-weight:800;">${c.label}</div>
                    <div style="font-size:.7rem;color:${c.color};">Estado de ${esc(m.nombre||'la mascota')}: ${esc(c.estado)}</div>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
        ` : '<div style="margin-top:10px;font-size:.78rem;color:var(--suave);">Este titular no tiene mascotas cargadas.</div>'}
      </div>`;
    }).join('');
  } catch(e) {
    lista.innerHTML = '<p style="color:#ef4444;">Error: '+e.message+'</p>';
  }
}

async function vetVerHistoria(mascotaId) {

  vetCurrentMascotaId = mascotaId;

  const tabs = document.querySelectorAll('.vet-tab');

  const tabHistoria = document.getElementById('vet-tab-historia');
  if (tabHistoria) tabHistoria.style.display = 'block';

  tabBtns.forEach(b => { if(b.dataset.tab==='historia') b.classList.add('active'); });

let vetCurrentMascotaId = '';
// Contexto del form de atención abierto: mascota (doc) + sus atenciones (para el cupo del veredicto). Motor Fase 2.
let _atenCtx = null;

// Prestaciones agrupadas en <optgroup> (value = clave de COBERTURAS). Fuente única: el núcleo.
function opcionesPrestacion() {
  return MC.prestacionesPorCategoria().map(g =>
    `<optgroup label="${esc(g.categoria)}">` +
    g.items.map(it => `<option value="${esc(it.key)}">${esc(it.label)}</option>`).join('') +
    `</optgroup>`
  ).join('');
}
// Monto: coma→punto, 0 permitido (beneficios sin cargo), rechazo NaN/negativos → null. Patrón pesos.
function parseMontoAten(raw) {
  const s = String(raw == null ? '' : raw).trim().replace(',', '.');
  if (s === '') return 0;
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return (isFinite(n) && n >= 0) ? n : null;
}
// Nota (fix Fase 2): se pasa el DOC de mascota CRUDO al motor (tiene plan/estado/creadoEn). MC._altaMs resuelve el
// alta desde creadoEn (Timestamp) de forma robusta. NO se pre-convierte acá — esa conversión era un punto de falla
// (daba altaMs null → la carencia caía en fail-open → cirugía figuraba cubierta en vez de EN CARENCIA).
// Panel de veredicto: INFORMA, no bloquea. Colores por estado. Todo texto por esc().
function _panelVeredicto(cob, monto) {
  // Semántica de marca: cubierto → azul/positivo · carencia y post-cupo → ámbar · sin cobertura → gris · rojo SOLO error.
  const m = cob.motivo || '';
  const socio = /precio socio/i.test(m);
  const esError = /inválid|invalid/i.test(m);
  const esCarencia = /carencia/i.test(m);
  const col = cob.cubre ? ['#EBF3FC', '#0d3d75', '#1A5FB4']
    : esError ? ['#fef2f2', '#991b1b', '#e11d48']
    : (socio || esCarencia) ? ['#FFF7E6', '#8a5a00', '#F2B84D']
    : ['#F1F3F7', '#4b5563', '#9aa6bd'];
  let linea2 = '';
  if (cob.cubre || socio) {
    linea2 = `<div style="font-size:.8rem;margin-top:4px;">Reintegro: <strong>$${(Number(cob.reintegro) || 0).toLocaleString('es-AR')}</strong> · A cargo del socio: <strong>$${(Number(cob.aCargoSocio) || 0).toLocaleString('es-AR')}</strong></div>`;
  }
  return `<div style="background:${col[0]};border-left:4px solid ${col[2]};border-radius:8px;padding:10px 12px;margin-top:8px;">
    <div style="font-size:.8rem;font-weight:800;color:${col[1]};">${esc(cob.motivo || '')}</div>${linea2}
    <div style="font-size:.68rem;color:#9ca3af;margin-top:4px;">El veredicto informa — podés guardar igual.</div>
  </div>`;
}
function actualizarVeredicto() {
  const cont = document.getElementById('vetVeredicto');
  if (!cont || !_atenCtx || !_atenCtx.mascota) return;
  const prest = v('vetAtenTipo');
  const montoEl = document.getElementById('vetAtenMonto');
  const monto = parseMontoAten(montoEl ? montoEl.value : '');
  if (monto === null) { cont.innerHTML = _panelVeredicto({ cubre: false, motivo: 'Monto inválido — revisá el número (sin negativos).' }, 0); return; }
  // El motor filtra por prestación (tipo) y ventana internamente → se le pasan TODAS las atenciones crudas (fecha Timestamp).
  const cob = MC.cobertura(_atenCtx.mascota, prest, monto, { fechaMs: Date.now(), atenciones: _atenCtx.atenciones || [] });
  cont.innerHTML = _panelVeredicto(cob, monto);
}

async function vetMostrarFormAtencion(mascotaId) {
  let wrap = document.getElementById('formNuevaAtencionWrap');
  if (!wrap) return;
  if (wrap.style.display !== 'none') { wrap.style.display = 'none'; return; }

  // Verificar auto-atencion: vet no puede cargar atencion a su propia mascota
  const userData = currentUserData;
  const propiasMascotas = (userData?.mascotas || []).map(m => m.mascotaId).filter(Boolean);
  if (propiasMascotas.includes(mascotaId)) {
    toast('No podes cargar atenciones a tu propia mascota.');
    return;
  }

  // Cargar mascota (doc crudo, con creadoEn) + sus atenciones (para el cupo). where mascotaId a secas → sin índice.
  _atenCtx = null;
  let mascota = null, atenciones = [];
  try {
    mascota = await mascGet(mascotaId);
    const snap = await db.collection('atenciones').where('mascotaId', '==', mascotaId).get();
    atenciones = snap.docs.map(d => d.data());
  } catch (e) {}
  _atenCtx = { mascotaId, mascota, atenciones };
  const mascotaNombre = (mascota && mascota.nombre) || mascotaId;

  // Re-fetch del wrap: si la vista historia se re-renderizó durante el await, el `wrap` capturado quedó DETACHED
  // (el form se armaba en un nodo viejo, invisible → "el botón no hace nada"). Tomamos el nodo vigente.
  wrap = document.getElementById('formNuevaAtencionWrap');
  if (!wrap) return;
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="form-box" style="margin-bottom:16px;">
      <div style="font-size:.75rem;font-weight:800;color:var(--noche);margin-bottom:10px;text-transform:uppercase;">Nueva atencion — ${esc(mascotaNombre)}</div>
      <div class="fstack">
        <select id="vetAtenTipo" class="input-field" onchange="actualizarVeredicto()">${opcionesPrestacion()}</select>
        <input id="vetAtenMonto" class="input-field" inputmode="decimal" placeholder="Monto de la prestación ($) — 0 si sin cargo" oninput="actualizarVeredicto()">
        <div id="vetVeredicto"></div>
        <textarea id="vetAtenDiag" placeholder="Diagnostico *" class="input-field" style="height:70px;resize:vertical;"></textarea>
        <textarea id="vetAtenTrat" placeholder="Tratamiento" class="input-field" style="height:60px;resize:vertical;"></textarea>
        <div>
          <label class="foto-label" for="vetAtenAdj">Adjuntar archivos (opcional)</label>
          <input type="file" id="vetAtenAdj" multiple accept="image/*,.pdf" style="display:none">
        </div>
        <div style="display:flex;gap:8px;">
          <button data-action="guardar-atencion" data-mascota-id="${esc(mascotaId)}" data-nombre="${esc(mascotaNombre)}" class="btn-primary" style="flex:1;">Guardar atencion</button>
          <button onclick="document.getElementById('formNuevaAtencionWrap').style.display='none'" class="bmini brojo" style="padding:10px 16px;">X</button>
        </div>
        <p id="vetAtenMsg" style="font-size:.8rem;"></p>
      </div>
    </div>
  `;
  actualizarVeredicto(); // veredicto inicial (consulta / monto 0)
}

async function vetGuardarAtencion(mascotaId, mascotaNombre) {
  const tipo = v('vetAtenTipo');
  const diagnostico = v('vetAtenDiag');
  const tratamiento = v('vetAtenTrat');
  const montoEl = document.getElementById('vetAtenMonto');
  const monto = parseMontoAten(montoEl ? montoEl.value : '');
  setMsg('vetAtenMsg','',true);

  // REGLA UX (mostrador): si el guardado aborta, SIEMPRE feedback VISIBLE (toast prominente + msg inline). Un
  // "Guardar" que no guarda y no dice nada es inaceptable. `abortarGuardado` centraliza el aviso doble.
  const abortarGuardado = (msg) => { setMsg('vetAtenMsg', msg, false); toast('No se guardó: ' + msg); };

  if (!mascotaId) { abortarGuardado('no pude determinar la mascota. Cerrá y reabrí "Nueva atención".'); return; }
  if (!diagnostico) { abortarGuardado('completá el diagnóstico.'); return; }
  if (monto === null) { abortarGuardado('revisá el monto (número, sin negativos; 0 si no hay cargo).'); return; }

  try {
    const uid = auth.currentUser.uid;
    const p = currentUserData;

    // Adjuntos (base64, solo imagenes por ahora)
    const adjuntos = [];
    const adjInput = document.getElementById('vetAtenAdj');
    if (adjInput && adjInput.files) {
      for (let i = 0; i < Math.min(adjInput.files.length, 3); i++) {
        const file = adjInput.files[i];
        if (file.type.startsWith('image/')) {
          try {
            const b64 = await comprimirFoto(file, 600);
            adjuntos.push({ nombre: file.name, tipo: file.type, data: b64 });
          } catch(e) {}
        }
      }
    }

    // Buscar titularUid (dueño de la mascota) en la colección. La regla EXIGE titularUid no vacío en el create.
    const mDoc = await mascGet(mascotaId);
    const titularUid = mDoc ? (mDoc.titularUid || '') : '';
    if (!titularUid) { abortarGuardado('no pude identificar al titular de esta mascota. Buscala de nuevo desde la colección.'); return; }

    // SNAPSHOT del veredicto de cobertura al momento de crear (auditable: lo que el sistema dijo ese día,
    // aunque la matriz cambie después). Cupo: atenciones de la MISMA prestación (where mascotaId a secas → sin índice),
    // el motor las acota a la ventana de aniversario. Legacy 'Sin definir' → cob.cubre false, se guarda igual.
    const ahora = Date.now();
    let snapCob = { cubre: false, pct: 0, tope: null, aCargoSocio: monto, motivo: 'No se pudo calcular', calculadoEn: ahora };
    try {
      const atsSnap = await db.collection('atenciones').where('mascotaId','==',mascotaId).get();
      // mDoc CRUDO (creadoEn) + TODAS las atenciones → el motor filtra por prestación y ventana (fix bug de cupo/carencia).
      const cob = MC.cobertura(mDoc, tipo, monto, { fechaMs: ahora, atenciones: atsSnap.docs.map(d => d.data()) });
      snapCob = { cubre: cob.cubre, pct: cob.pct, tope: cob.tope, aCargoSocio: cob.aCargoSocio, motivo: cob.motivo, calculadoEn: ahora };
    } catch(e) {}

    const atenRef = await db.collection('atenciones').add({
      prestadorId: uid,
      prestadorNombre: (p.nombre||'') + ' ' + (p.apellido||''),
      mascotaId: mascotaId,
      mascotaNombre: mascotaNombre,
      titularUid: titularUid,
      tipo: tipo,
      diagnostico: diagnostico,
      tratamiento: tratamiento,
      monto: monto,
      adjuntos: adjuntos,
      estado: 'pendiente',
      cobertura: snapCob,
      fecha: TS()
    });

    // Link caso→atención: si esta atención viene de derivar un caso ("Cerrar + atención") y es de la
    // MISMA mascota, escribimos su id en casos/{casoId}.atencionId. Best-effort: no bloquea el alta si falla.
    if (_casoParaAtencion && _casoParaAtencion.mascotaId === mascotaId) {
      const casoId = _casoParaAtencion.casoId;
      _casoParaAtencion = null;
      try {
        await db.collection('casos').doc(casoId).set({ atencionId: atenRef.id }, {merge:true});
      } catch(e) {}
    }

    toast('Atencion registrada correctamente.');
    document.getElementById('formNuevaAtencionWrap').style.display = 'none';
    vetVerHistoria(mascotaId);
  } catch(e) {
    setMsg('vetAtenMsg','Error: '+e.message,false);
    toast('No se pudo guardar la atención.');
  }
}

// ── VET: MIS PACIENTES ──
async function cargarMisPacientes() {
  const el = document.getElementById('vet-pacientes-content');
  if (!el) return;
  el.innerHTML = '<p style="color:#5a6a8a;font-size:.85rem;">Cargando...</p>';

  try {
    const uid = auth.currentUser.uid;
    const snap = await db.collection('atenciones')
      .where('prestadorId','==',uid)
      .get();

    const mascotaIds = [...new Set(snap.docs.map(d => d.data().mascotaId).filter(Boolean))];

    if (mascotaIds.length === 0) {
      el.innerHTML = '<p style="color:#9ca3af;font-size:.85rem;">Todavia no atendiste a ninguna mascota.</p>';
      return;
    }

    // Buscar info de cada mascota en la colección + su titular.
    const [masSnap, usSnap] = await Promise.all([
      db.collection('mascotas').get(),
      db.collection('usuarios').get(),
    ]);
    const titulares = {};
    usSnap.docs.forEach(d => { titulares[d.id] = d.data(); });
    const pacientes = [];
    masSnap.docs.forEach(d => {
      const m = {id:d.id, ...d.data()};
      if (!m.mascotaId || !mascotaIds.includes(m.mascotaId)) return;
      const u = titulares[m.titularUid] || {};
      const atencionesCount = snap.docs.filter(ad => ad.data().mascotaId === m.mascotaId).length;
      const ultimaAtencion = snap.docs
        .filter(ad => ad.data().mascotaId === m.mascotaId)
        .map(ad => ad.data().fecha?.toDate?.())
        .filter(Boolean)
        .sort((a,b) => b-a)[0];
      pacientes.push({
        ...m,
        titularNombre: (u.nombre||'') + ' ' + (u.apellido||''),
        nroSocio: u.nroSocio || '',
        atencionesCount,
        ultimaAtencion
      });
    });

    el.innerHTML = pacientes.map(p => `
      <div style="display:flex;align-items:center;gap:10px;padding:14px;background:var(--fondo);border-radius:12px;margin-bottom:8px;cursor:pointer;border:1px solid rgba(26,95,180,.06);" onclick="vetVerHistoria('${p.mascotaId}')">
        ${p.foto
          ? `<img src="${esc(p.foto)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #5BA3E8;">`
          : `<div style="width:40px;height:40px;border-radius:50%;background:#EBF3FC;display:flex;align-items:center;justify-content:center;font-size:1rem;"><svg class="ic-pet"><use href="#ic-mascotas"/></svg></div>`}
        <div style="flex:1;">
          <div style="font-size:.85rem;font-weight:700;">${esc(p.nombre||'—')} <span style="font-size:.72rem;color:#9ca3af;font-weight:400;">${esc(p.mascotaId)}</span></div>
          <div style="font-size:.72rem;color:var(--suave);">${esc(p.raza||'')} · Titular: ${esc(p.titularNombre)} ${p.nroSocio?'('+esc(p.nroSocio)+')':''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:.82rem;font-weight:800;color:var(--azul);">${p.atencionesCount} at.</div>
          <div style="font-size:.68rem;color:#9ca3af;">${p.ultimaAtencion?p.ultimaAtencion.toLocaleDateString('es-AR'):''}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    el.innerHTML = '<p style="color:#ef4444;">Error: '+e.message+'</p>';
  }
}

// ══ F1-B · BANDEJA DE CASOS (despacho veterinario) ══
// SPLIT N3: `casos` = cara al titular (relato/estado/respuestaTitular). `casos_clinico` = SOLO staff
// (prioridadInterna/notasVet). El titular NUNCA lee casos_clinico (reglas). Al titular se le responde
// en `casos.respuestaTitular` con cuidado y acción, jamás con la clasificación interna.
function tmsV(t){ return t&&t.toMillis?t.toMillis():0; }
function desdeTexto(v){ return {hoy:'hoy', ayer:'ayer', varios_dias:'hace varios días'}[v]||v||''; }

async function cargarBandejaCasos(){
  _casoParaAtencion = null; // volver a la bandeja descarta una derivación "Cerrar + atención" abandonada
  const el=document.getElementById('vet-casos-content'); if(!el) return;
  el.innerHTML='<p style="color:#5a6a8a;font-size:.85rem;">Cargando...</p>';
  try{
    const [casosSnap, clinicoSnap, usSnap] = await Promise.all([
      db.collection('casos').get(),
      db.collection('casos_clinico').get(),
      db.collection('usuarios').get(),
    ]);
    const clinico={}; clinicoSnap.docs.forEach(d=>clinico[d.id]=d.data());
    const titulares={}; usSnap.docs.forEach(d=>titulares[d.id]=d.data());
    const ord={nuevo:0, en_curso:1};
    const casos=casosSnap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.estado!=='cerrado')
      .sort((a,b)=>((ord[a.estado]??9)-(ord[b.estado]??9)) || (tmsV(b.creadoEn)-tmsV(a.creadoEn)));
    if(casos.length===0){ el.innerHTML='<p style="color:#9ca3af;font-size:.85rem;">No hay casos entrantes. &#10003;</p>'; return; }
    const nombreVet=(cl)=>{ if(!cl||!cl.tomadoPor) return ''; const t=titulares[cl.tomadoPor]; return t?((t.nombre||'')+' '+(t.apellido||'')).trim():'otro veterinario'; };
    el.innerHTML=casos.map(c=>casoCard(c, clinico[c.id]||{}, titulares[c.titularUid]||{}, nombreVet(clinico[c.id]))).join('');
  }catch(e){ el.innerHTML='<p style="color:#ef4444;">Error: '+e.message+'</p>'; }
}

function casoCard(c, cl, u, tomadoPorNombre){
  const nuevo = c.estado==='nuevo';
  const cuandoTom = cl.tomadoEn&&cl.tomadoEn.toDate?cl.tomadoEn.toDate().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const badge = nuevo
    ? '<span style="background:#dbeafe;color:#1d4ed8;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:100px;text-transform:uppercase;">Nuevo</span>'
    : `<span style="background:#fef3c7;color:#92400e;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:100px;text-transform:uppercase;">En curso${tomadoPorNombre?' · '+esc(tomadoPorNombre):''}</span>`;
  const prio = cl.prioridadInterna||'';
  const opt=(v,t)=>`<option value="${v}" ${prio===v?'selected':''}>${t}</option>`;
  return `<div class="uitem">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <strong style="font-size:.95rem;">${esc(c.mascotaNombre||'—')} <span style="font-family:monospace;font-size:.72rem;color:#9ca3af;">${esc(c.mascotaId||'')}</span></strong>
      ${badge}
    </div>
    <div style="font-size:.76rem;color:#5a6a8a;margin-top:2px;">Titular: ${esc(u.nombre||'')} ${esc(u.apellido||'')}${u.nroSocio?(' · '+esc(u.nroSocio)):''}${u.telefono?(' · '+esc(u.telefono)):''}</div>

// Caso cuya atención está por registrarse (derivación "Cerrar + atención"): al guardar la atención
// escribimos su id de vuelta en casos/{casoId}.atencionId (link caso→atención). Guardamos también la
// mascota esperada para no vincular una atención de otra mascota si el vet se desvía. Se limpia tras usarse.
let _casoParaAtencion = null; // { casoId, mascotaId } | null
async function casoTomar(id){
  // Guardia ATÓMICA (guardia 24hs, vets rotando): solo se toma si sigue 'nuevo'. Si otro lo tomó, avisa y refresca.
  try{
    const ref=db.collection('casos').doc(id);
    await db.runTransaction(async tx=>{
      const s=await tx.get(ref);
      if(!s.exists) throw new Error('El caso ya no existe.');
      if(s.data().estado!=='nuevo') throw new Error('Ese caso ya lo tomó otro veterinario.');
      tx.update(ref, { estado:'en_curso' });
    });
    await db.collection('casos_clinico').doc(id).set({ tomadoPor:auth.currentUser.uid, tomadoEn:TS() }, {merge:true});
    cargarBandejaCasos();
  }catch(e){ alert(e.message); cargarBandejaCasos(); }
}
async function casoGuardar(id){
  try{
    const prio=document.getElementById('caso-prio-'+id)?.value||'';
    const notas=document.getElementById('caso-notas-'+id)?.value||'';
    const resp=document.getElementById('caso-resp-'+id)?.value||'';
    // Clínico interno (solo staff) + respuesta al titular (en `casos`, que el titular sí lee).
    await db.collection('casos_clinico').doc(id).set({ prioridadInterna:prio, notasVet:notas, actualizadoPor:auth.currentUser.uid, actualizadoEn:TS() }, {merge:true});
    await db.collection('casos').doc(id).set({ respuestaTitular:resp }, {merge:true});
    toast('Guardado.');
  }catch(e){ alert('Error: '+e.message); }
}
async function casoCerrar(id, mascotaIdOrFalse){
  try{
    // guardar la respuesta al titular pendiente antes de cerrar (si la escribió)
    const resp=document.getElementById('caso-resp-'+id)?.value;
    const upd={ estado:'cerrado' }; if(resp!=null) upd.respuestaTitular=resp;
    await db.collection('casos').doc(id).set(upd, {merge:true});
    if(mascotaIdOrFalse && mascotaIdOrFalse!=='false'){
      // Derivar a atención: cerramos el caso y abrimos la historia/alta de atención de esa mascota.
      // Recordamos el caso para vincularle la atención que el vet registre a continuación.
      _casoParaAtencion = { casoId: id, mascotaId: mascotaIdOrFalse };
      toast('Caso cerrado. Registrá la atención.');
      vetVerHistoria(mascotaIdOrFalse);
    } else {
      cargarBandejaCasos();
    }
  }catch(e){ alert('Error: '+e.message); }
}

// ══ TURNOS — panel del vet (Fase 2, solo demo). Franjas + turnos + marca de asistencia. Todo por client SDK con las
//    reglas que ya permiten a vet/admin: create/update de agenda_turnos y update acotado de turnos (campos de marca). ══
function _tHoyBA(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function _tAMin(h){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(h||'')); return m?(+m[1]*60+ +m[2]):null; }
function _fmtFechaVet(ymd){ const p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd||''); if(!p) return ymd||''; return new Date(Date.UTC(+p[1],+p[2]-1,+p[3])).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); }

async function crearFranjaVet(){
  const msg=document.getElementById('vet-franja-msg');
  const fecha=document.getElementById('fFecha').value, ini=document.getElementById('fIni').value, fin=document.getElementById('fFin').value;
  const dur=parseInt(document.getElementById('fDur').value,10);
  msg.style.color='#dc2626';
  if(!fecha||!ini||!fin){ msg.textContent='Completá fecha, desde y hasta.'; return; }
  if(fecha<_tHoyBA()){ msg.textContent='La fecha no puede ser pasada.'; return; }
  if(_tAMin(ini)==null||_tAMin(fin)==null||_tAMin(ini)>=_tAMin(fin)){ msg.textContent='El horario "desde" tiene que ser menor que "hasta".'; return; }
  if(!(dur>0)){ msg.textContent='La duración del slot tiene que ser mayor a 0.'; return; }
  try{
    await db.collection('agenda_turnos').add({ fecha, horaInicio:ini, horaFin:fin, duracionSlotMin:dur, activa:true, slotsTomados:[], creadoEn:TS(), actualizadoEn:TS() });
    msg.style.color='#166534'; msg.textContent='Franja publicada.';
    toast('Franja publicada');
    cargarTurnosVet();
  }catch(e){ msg.style.color='#dc2626'; msg.textContent='No se pudo publicar: '+(e.message||e.code||'error'); }
}

async function bajaFranjaVet(id){
  try{ await db.collection('agenda_turnos').doc(id).update({ activa:false, actualizadoEn:TS() }); toast('Franja dada de baja'); cargarTurnosVet(); }
  catch(e){ toast('No se pudo: '+(e.code||e.message||'error')); }
}

async function marcarAsistenciaVet(turnoId, resultado){
  try{
    const uid=auth.currentUser?auth.currentUser.uid:null;
    await db.collection('turnos').doc(turnoId).update({ estado:resultado, estadoMarcadoPor:uid, estadoMarcadoEn:TS() });
    toast(resultado==='atendido'?'Marcado como atendido':'Marcado como ausente');
    cargarTurnosVet();
  }catch(e){ toast('No se pudo marcar: '+(e.code||e.message||'error')); }
}

async function cargarTurnosVet(){
  const wrapF=document.getElementById('vet-franjas-lista'), wrapT=document.getElementById('vet-turnos-lista');
  if(!wrapF||!wrapT) return;
  try{
    const [agSnap,tSnap]=await Promise.all([
      db.collection('agenda_turnos').where('activa','==',true).get(),
      db.collection('turnos').get()
    ]);
    const hoy=_tHoyBA();
    const franjas=agSnap.docs.map(d=>({id:d.id,...d.data()})).filter(f=>String(f.fecha||'')>=hoy).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    wrapF.innerHTML = franjas.length ? franjas.map(f=>{
      const tomados=Array.isArray(f.slotsTomados)?f.slotsTomados.length:0;
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef2f7;">
        <div style="font-size:.85rem;"><strong style="text-transform:capitalize;">${esc(_fmtFechaVet(f.fecha))}</strong> · ${esc(f.horaInicio||'')}–${esc(f.horaFin||'')} · slot ${esc(String(f.duracionSlotMin||''))}min · ${tomados} tomado(s)</div>
        <button class="btn-secondary" style="font-size:.72rem;padding:4px 10px;" data-baja-franja="${esc(f.id)}">Dar de baja</button>
      </div>`;
    }).join('') : `<p style="color:#9ca3af;font-size:.82rem;">No hay franjas activas. Publicá una arriba.</p>`;
    wrapF.querySelectorAll('[data-baja-franja]').forEach(b=>b.addEventListener('click',()=>bajaFranjaVet(b.getAttribute('data-baja-franja'))));

    // Turnos: nombres de titulares (usuarios read permitido). Orden por fecha+hora.
    const turnos=tSnap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.estado!=='cancelado')
      .sort((a,b)=>String((a.fecha||'')+(a.hora||'')).localeCompare(String((b.fecha||'')+(b.hora||''))));
    const uids=[...new Set(turnos.map(t=>t.titularUid).filter(Boolean))];
    const nombres={};
    await Promise.all(uids.map(async u=>{ try{ const d=await db.collection('usuarios').doc(u).get(); if(d.exists){ const x=d.data(); nombres[u]=((x.nombre||'')+' '+(x.apellido||'')).trim()+(x.nroSocio?` (${x.nroSocio})`:''); } }catch(_){}}));
    wrapT.innerHTML = turnos.length ? turnos.map(t=>{
      const pasadoOhoy = String(t.fecha||'')<=hoy;
      const marca = (t.estado==='creado' && pasadoOhoy)
        ? `<div style="display:flex;gap:6px;margin-top:6px;"><button class="btn-secondary" style="font-size:.72rem;padding:4px 10px;" data-marca="atendido" data-turno="${esc(t.id)}">Atendido</button><button class="btn-secondary" style="font-size:.72rem;padding:4px 10px;" data-marca="ausente" data-turno="${esc(t.id)}">Ausente</button></div>`
        : `<span style="font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:100px;background:${t.estado==='atendido'?'#dcfce7':t.estado==='ausente'?'#fee2e2':'#e0e7ff'};color:${t.estado==='atendido'?'#166534':t.estado==='ausente'?'#991b1b':'#3730a3'};">${esc(t.estado||'')}</span>`;
      return `<div style="padding:9px 0;border-top:1px solid #eef2f7;">
        <div style="font-size:.85rem;"><strong style="text-transform:capitalize;">${esc(_fmtFechaVet(t.fecha))}</strong> · ${esc(t.hora||'')} hs · ${esc(t.mascotaNombre||'mascota')}</div>
        <div style="font-size:.78rem;color:#5a6a8a;">${esc(nombres[t.titularUid]||t.titularUid||'')}</div>
        ${marca}
      </div>`;
    }).join('') : `<p style="color:#9ca3af;font-size:.82rem;">No hay turnos reservados.</p>`;
    wrapT.querySelectorAll('[data-marca]').forEach(b=>b.addEventListener('click',()=>marcarAsistenciaVet(b.getAttribute('data-turno'), b.getAttribute('data-marca'))));
  }catch(e){ wrapF.innerHTML=`<p style="color:#dc2626;font-size:.82rem;">No se pudieron cargar las franjas (${esc(e.code||e.message||'error')}).</p>`; wrapT.innerHTML=''; }
}

async function cambiarEstado(uid,estado){
  const update = {estado};
  if (estado === 'activo') {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    if (!ud.nroSocio) {
      const nroSocio = await generarNroSocio();
      update.nroSocio = nroSocio;
    }
    const nroSocio = ud.nroSocio || update.nroSocio;
    const mascotas = ud.mascotas ? [...ud.mascotas] : [];
    let mascotasChanged = false;
    for (let i = 0; i < mascotas.length; i++) {
      const r = ensureMascotaFields(mascotas[i], nroSocio, i);
      if (r.changed) { mascotas[i] = r.mascota; mascotasChanged = true; }
    }
    if (mascotasChanged) update.mascotas = mascotas;
    await db.collection('usuarios').doc(uid).update(update);
    const updatedSnap = await db.collection('usuarios').doc(uid).get();
    const updatedData = updatedSnap.data();
    const updatedMascotas = updatedData.mascotas || [];
    for (let i = 0; i < updatedMascotas.length; i++) {
      if (updatedMascotas[i].token) {
        await syncMascotaPublica(updatedData, updatedMascotas[i], i);
      }
    }
    // F0.5: materializar mascotas en la colección y DAR cobertura (activar cada mascota del titular).
    await espejarMascotasEnColeccion(uid);
    await activarMascotasDe(uid, 'activo');
  } else {
    await db.collection('usuarios').doc(uid).update(update);
    // F0.5: suspender al titular corta la cobertura de TODAS sus mascotas.
    await activarMascotasDe(uid, 'suspendido');
  }
  cargarUsuariosAdmin();
}

async function generarNroSocio() {
  const snap = await db.collection('usuarios')
    .where('nroSocio', '>=', 'MP-')
    .orderBy('nroSocio', 'desc')
    .limit(1).get();
  if (snap.empty) return 'MP-0001';
  const ultimo = snap.docs[0].data().nroSocio;
  const num = parseInt(ultimo.replace('MP-', '')) + 1;
  return 'MP-' + String(num).padStart(4, '0');
}

async function confirmarEliminarMascota(uid, index, nombre) {
  if (!confirm(`Eliminas a ${nombre}? Esta accion no se puede deshacer.`)) return;
  try {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    const mascotas = ud.mascotas ? [...ud.mascotas] : [];
    const oldToken = mascotas[index]?.token;
    const oldMascotaId = mascotas[index]?.mascotaId;
    mascotas.splice(index, 1);
    await db.collection('usuarios').doc(uid).update({ mascotas });
    if (oldToken) {
      try { await db.collection('mascotas_publicas').doc(oldToken).delete(); } catch(e) {}
    }
    if (oldMascotaId) { try { await db.collection('mascotas').doc(oldMascotaId).delete(); } catch(e) {} }
    cargarUsuariosAdmin();
  } catch(e) { alert('Error al eliminar: ' + e.message); }
}

function confirmarEliminarUsuario(uid, nombre) {
  if (!confirm(`Eliminas el usuario ${nombre}?\n\nEsta accion elimina todos sus datos de MEDIPaw.`)) return;
  eliminarUsuario(uid);
}

async function eliminarUsuario(uid) {
  try {
    const snap = await db.collection('usuarios').doc(uid).get();
    const ud = snap.data();
    const email = ud?.email || '';
    const mascotas = ud?.mascotas || [];
    for (const m of mascotas) {
      if (m.token) {
        try { await db.collection('mascotas_publicas').doc(m.token).delete(); } catch(e) {}
      }
    }
    // F0.5: borrar también los docs de la colección mascotas de este titular.
    try { const ms = await db.collection('mascotas').where('titularUid','==',uid).get(); for (const d of ms.docs) { try { await d.ref.delete(); } catch(e) {} } } catch(e) {}
    await db.collection('usuarios').doc(uid).delete();
    if (email) {
      try { await auth.sendPasswordResetEmail(email); } catch(e) {}
    }
    cargarUsuariosAdmin();
    alert('Usuario eliminado.');
  } catch(e) { alert('Error al eliminar: ' + e.message); }
}

// ══ F1-C · CONTABLE (comprobantes de cuota, internos no-fiscales) ══
// El comprobante es una FOTO (snapshot): al emitir se congelan items+total (MC.armarComprobante). NO recalcula.
// Numeración correlativa ATÓMICA (transacción sobre contadores/comprobantes). Idempotente por (titular, período).
async function siguienteNroComprobante(){
  const ref=db.collection('contadores').doc('comprobantes');
  return db.runTransaction(async tx=>{ const s=await tx.get(ref); const n=((s.exists&&s.data().ultimo)||0)+1; tx.set(ref,{ultimo:n},{merge:true}); return n; });
}

async function emitirPeriodo(){
  const periodo=document.getElementById('emitPeriodo')?.value||''; const msg=document.getElementById('emitMsg');
  if(!/^\d{4}-\d{2}$/.test(periodo)){ if(msg){msg.textContent='Elegí un período válido.';msg.style.color='#ef4444';} return; }
  if(msg){ msg.textContent='Emitiendo…'; msg.style.color='#5a6a8a'; }
  try{
    const [usSnap, masSnap, compSnap] = await Promise.all([
      db.collection('usuarios').get(),
      db.collection('mascotas').get(),
      db.collection('comprobantes').where('periodo','==',periodo).get(),
    ]);
    const yaEmitido=new Set(compSnap.docs.map(d=>d.data().titularUid));
    const mascotasPorTitular={};
    masSnap.docs.forEach(d=>{ const m={id:d.id,...d.data()}; (mascotasPorTitular[m.titularUid]=mascotasPorTitular[m.titularUid]||[]).push(m); });
    const venceISO=MC.venceComprobanteISO(periodo);
    const venceTs=venceISO?firebase.firestore.Timestamp.fromDate(new Date(venceISO)):null;
    let emitidos=0, saltados=0, sinActivas=0;
    for(const d of usSnap.docs){
      const u={id:d.id,...d.data()};
      if(!getUserRoles(u).includes('afiliado')) continue;
      if(yaEmitido.has(u.id)){ saltados++; continue; }
      const snap=MC.armarComprobante(mascotasPorTitular[u.id]||[], periodo);
      if(snap.items.length===0){ sinActivas++; continue; }
      const nro=await siguienteNroComprobante();
      await db.collection('comprobantes').add({
        titularUid:u.id, titularNombre:((u.nombre||'')+' '+(u.apellido||'')).trim(), nroSocio:u.nroSocio||'',
        periodo, items:snap.items, total:snap.total, estado:'emitida', fiscal:false,
        venceEl:venceTs, nroComprobante:MC.fmtComprobante(nro), emitidaEn:TS(), emitidaPor:auth.currentUser.uid
      });
      emitidos++;
    }
    if(msg){ msg.textContent=`Emitidos ${emitidos} · ya existían ${saltados} · sin mascotas activas ${sinActivas}.`; msg.style.color='#166534'; }
    cargarCuotasAdmin();

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
  document.getElementById('tab-'+tab).style.display='block';
  btn.classList.add('active');
  if(tab==='dashboard')cargarDashboard();
  if(tab==='afiliados')cargarUsuariosAdmin();
  if(tab==='veterinarios')cargarVeterinariosAdmin();
  if(tab==='proveedores')cargarProveedoresAdmin();
  if(tab==='cuotas')cargarCuotasAdmin();
  if(tab==='pagos')cargarAtencionesAdmin();
